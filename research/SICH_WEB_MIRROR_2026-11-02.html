<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sich — mission control (web mirror)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ===========================================================================
   Sich web mirror — a playable HTML replica of the shipping macOS app
   (app/Sources/SichApp). Every token below is copied from BoardTheme.swift;
   every size from the AppKit layout constants. It is a toy for trying ideas
   fast, not shipping code. Light/dark follow the system (or the demo pill).
   ========================================================================= */
:root {
  --canvas:#F1F4F7; --canvas-sunken:#E5EBF0; --card:#FFFFFF; --card-raised:#F8FBFD;
  --stroke:#C8D2DA; --stroke-strong:#9EACB8; --hairline:#D3DCE3;
  --needs-col:#FFF0F0; --needs-card:#FFE8E8;
  --gauge-track:#CBD5DD; --harness:#586975;
  --text:#24313A; --muted:#3A4A54; --faint:#586975; --dim:#4F606B;
  --term-bg:#FAFBFC; --term-fg:#24313A; --term-cursor:#009966; --term-link:#0969DA;
  --ansi-red:#B52D22; --ansi-green:#4F6F00; --ansi-blue:#1E6FB0; --ansi-yellow:#6F5200;
  --overlay-shadow: rgba(0,0,0,.18);
  /* shared accents (same in both appearances) */
  --brand:#7AA6DA; --attention:#D97A3A; --alert:#E84C3D; --quota-blocked:#9B7BB8;
  --healthy:#7FA06F; --needs:#E84C3D; --needs-stroke:#B52D22; --gauge-label-on-fill:#08121C;
  --s-idle:#667980; --s-parked:#728797; --s-running:#3A9ADE; --s-tests:#7A5FB8;
  --s-waiting:#E84C3D; --s-blocked:#E84C3D; --s-done:#99CC00; --s-unknown:#728797; --s-unreachable:#E84C3D;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  --fs:1;            /* board type scale = manual zoom × responsive shrink */
  --term-fs:20px;    /* drill-in terminal font */
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dark:1; } }
:root[data-theme="dark"] { --dark:1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas:#20242B; --canvas-sunken:#191D23; --card:#282C34; --card-raised:#323842;
    --stroke:#414956; --stroke-strong:#596576; --hairline:#2C323B;
    --needs-col:#271F22; --needs-card:#3A2226;
    --gauge-track:#1B1F26; --harness:#A3AAB5;
    --text:#F0F2F5; --muted:#C5C8C6; --faint:#9299A5; --dim:#747C89;
    --term-bg:#282C34; --term-fg:#FFFFFF; --term-cursor:#FFFFFF; --term-link:#61AFEF;
    --ansi-red:#CC6666; --ansi-green:#B5BD68; --ansi-blue:#81A2BE; --ansi-yellow:#F0C674;
    --overlay-shadow: rgba(0,0,0,.5); --focus-ink:#7AA6DA; --gauge-label-on-fill:#F0F2F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas:#20242B; --canvas-sunken:#191D23; --card:#282C34; --card-raised:#323842;
  --stroke:#414956; --stroke-strong:#596576; --hairline:#2C323B;
  --needs-col:#271F22; --needs-card:#3A2226;
  --gauge-track:#1B1F26; --harness:#A3AAB5;
  --text:#F0F2F5; --muted:#C5C8C6; --faint:#9299A5; --dim:#747C89;
  --term-bg:#282C34; --term-fg:#FFFFFF; --term-cursor:#FFFFFF; --term-link:#61AFEF;
  --ansi-red:#CC6666; --ansi-green:#B5BD68; --ansi-blue:#81A2BE; --ansi-yellow:#F0C674;
  --overlay-shadow: rgba(0,0,0,.5); --focus-ink:#7AA6DA; --gauge-label-on-fill:#F0F2F5;
  color-scheme: dark;
}

/* ---------- One signal. NEEDS YOU keeps its red; everything else drops its hue —
   no working blue, blocked red, done green, repo colours or lane dots. Column
   position alone says what a card is. */
/* Gauge fills are bleached toward the track: the tone still says healthy / low /
   empty at a glance, but a panel of full bars no longer competes with the board. */
:root { --plus:var(--brand); --shimmer:var(--brand);
  /* neutral translucent tiers: fuller pools a touch lighter, an empty pool a touch denser */
  --gauge-healthy:color-mix(in srgb, var(--text) 14%, transparent);
  --gauge-constrained:color-mix(in srgb, var(--text) 20%, transparent);
  --gauge-critical:color-mix(in srgb, var(--text) 30%, transparent); }
:root {
  --plus:var(--faint);
  --s-idle:var(--faint); --s-parked:var(--faint); --s-running:var(--faint); --s-tests:var(--faint);
  --s-blocked:var(--faint); --s-done:var(--faint); --s-unknown:var(--faint); --s-unreachable:var(--faint);
  --working-card:var(--card); --done-card:var(--card); --blocked-card:var(--card); --parked-card:var(--card);
  --parked-col:transparent; --blocked-col:transparent;
  --shimmer:var(--faint);
}
:root .lane.g-blocked .dot { display:none; }
:root .lane.g-blocked.active .caps { color:var(--muted); }
:root .card.s-blocked, :root .card.s-unreachable { border-color:transparent; }
:root .a-meta .proj { color:var(--faint) !important; }
:root .pgroup-head .pdot { background:var(--stroke-strong) !important; }
:root .chip.host.actionable { color:var(--muted); background:color-mix(in srgb, var(--faint) 16%, transparent); }
:root .chip.quota.low { color:var(--muted); background:color-mix(in srgb, var(--faint) 16%, transparent); }
:root .card.quota-blocked { border-color:transparent; }
:root .q-tally .work { color:var(--faint); }

* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  background:var(--canvas); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none;
  font-size:calc(11px * var(--fs));
}
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; }
.caps { font-size:calc(11px * var(--fs)); font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.spring { flex:1 1 0; min-width:0; }
[hidden] { display:none !important; }

/* ---------- root layout: board + quota (trailing dock, or bottom in portrait) */
#root { position:relative; height:100%; display:flex; flex-direction:row; }
#root.dock-bottom { flex-direction:column; }
#board { flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:row; align-items:stretch; }

/* ---------- lanes */
.lane { position:relative; display:flex; flex-direction:column; padding:12px 20px 0; min-width:0; }
.lane:not(.g-done) { border-right:1px solid var(--hairline); }
.lane.g-parked { background:var(--parked-col); }
/* ---- Board focus: one lane is "lit" at a time (see boardFocus). The handoff is a
   300ms crossfade of lane tint + title ink — system-driven and frequent, so no
   movement; NEEDS YOU keeps its red, a calm lane lifts a shade toward the card
   surface. The lane's + takes the brand blue only while QUEUE is the lit lane. */
:root { --focus-col:color-mix(in srgb, var(--brand) 13%, var(--canvas)); --focus-ink:#1E6FB0; }
.lane { transition:background-color .3s var(--ease); }
.pgroup-head.arrive { animation:arrive .2s var(--ease); }
.lane-head .caps { transition:color .3s var(--ease); }
.lane.focus:not(.g-needsYou) { background:var(--focus-col); }
.lane.focus .caps { color:var(--focus-ink); }
.lane.focus .count { color:var(--focus-ink); }
.lane.focus .sym[data-act="create"] circle { fill:var(--brand); }
.sym.breathe svg { animation:breathe 1.1s var(--ease) 2; transform-origin:center; }
@keyframes breathe { 0%,100% { transform:scale(1); } 40% { transform:scale(1.18); } }
.lane.g-needsYou.active { background:var(--needs-col); }
.lane.g-blocked.active { background:var(--blocked-col); }
.lane { flex:1 1 0; }
.lane.g-done.narrow { flex:0.7 1 0; padding-left:10px; padding-right:10px; }
.lane-head { display:flex; align-items:center; gap:8px; height:28px; flex:0 0 28px; white-space:nowrap; }
.lane-head .lead, .lane-head .trail { flex:1 1 0; }
.lane-head .dot { display:none !important; }
.lane.g-needsYou.active .dot { background:var(--needs); animation:pulse 1.2s ease-in-out infinite alternate; }
.lane.g-working.active .dot { background:var(--s-running); position:relative; }
/* ---- WORKING ambience: peripheral, slow, composite-only. The lane dot sends a
   soft sonar ring every 2.4s, and each working card carries a faint sheen that
   drifts across it every ~6.5s, staggered per card so the column shimmers out of
   phase — "the agents are busy" felt at the edge of vision, never read. */
.lane.g-working.active .dot::after { content:""; position:absolute; inset:0; border-radius:50%; background:inherit; animation:ping 3.2s var(--ease) infinite; }
@keyframes ping { 0% { transform:scale(1); opacity:.35; } 65%, 100% { transform:scale(2.4); opacity:0; } }
.card.s-running, .card.s-runningTests { overflow:hidden; }
.card.s-running::before, .card.s-runningTests::before { content:""; position:absolute; top:-40%; bottom:-40%; left:0; width:30%; pointer-events:none; background:linear-gradient(100deg, transparent 0%, color-mix(in srgb, var(--text) 4.5%, transparent) 50%, transparent 100%); transform:translateX(-160%) skewX(-14deg); animation:sheen 9s ease-in-out infinite; animation-delay:calc(var(--i, 0) * -3s); }
@keyframes sheen { 0% { transform:translateX(-160%) skewX(-14deg); } 30%, 100% { transform:translateX(400%) skewX(-14deg); } }
.lane.g-blocked.active .dot { background:var(--s-blocked); }
.lane:not(.active) .dot { display:none; }
.lane.g-needsYou.active .caps { color:var(--needs); }
.lane.g-blocked.active .caps { color:var(--s-blocked); }
/* Column signage reads first: a step larger and in the primary ink, tracking widened. */
.lane-head .caps, .q-title .caps, .rail .vcaps { font-size:calc(12.5px * var(--fs)); font-weight:700; letter-spacing:1px; color:var(--muted); }
.lane-head .count { font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:500; }
.sym { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; flex:0 0 30px; }
.sym svg { display:block; }
.sym:hover { background:var(--card-raised); }
.cell { flex:1 1 0; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:20px; border-radius:8px; margin-top:10px; scrollbar-width:thin; }
.cell.drop { outline:1.5px solid var(--brand); outline-offset:-1.5px; background:color-mix(in srgb, var(--brand) 6%, transparent); }

/* folded DONE rail */
.rail { width:44px; flex:0 0 44px; display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:12px; }
.rail .vcaps { writing-mode:vertical-rl; transform:rotate(180deg); }

/* ---------- cards */
.card {
  position:relative; background:var(--card); border-radius:10px; padding:12px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.12); border:1px solid transparent; cursor:default;
  transition:box-shadow .15s var(--ease), transform .16s var(--ease); display:flex; flex-direction:column; gap:4px;
}
.card:hover { box-shadow:0 1px 8px rgba(0,0,0,.26); }
.card:active { transform:scale(.97); transition-duration:.1s; }
.card.s-waitingForInput { background:var(--needs-card); border-color:var(--needs); box-shadow:0 0 4px color-mix(in srgb, var(--needs) 25%, transparent); }
.card.s-waitingForInput:hover { box-shadow:0 0 9px color-mix(in srgb, var(--needs) 39%, transparent); }
.card.s-blocked { background:var(--blocked-card); border-color:var(--s-blocked); }
.card.s-parked { background:var(--parked-card); }
.card.s-unreachable { border-color:var(--s-unreachable); }
.card.s-running, .card.s-runningTests { background:var(--working-card); }
.card.s-done { background:var(--done-card); flex-direction:row; align-items:center; gap:10px; }
.card.quota-blocked { border-color:var(--quota-blocked); }
.card.focused { border:2px solid var(--brand); padding:11px 13px; }
.card.dragging { opacity:.4; }
.card .foot { display:flex; align-items:center; gap:6px; min-width:0; height:14px; margin-top:2px; }
.card .foot .mark { width:12px; height:12px; flex:0 0 12px; -webkit-mask-size:12px 12px; mask-size:12px 12px; opacity:.75; }
/* SessionCard.remotePlaceLabel: "host:leaf" in the chip font, faint, no background. */
.card .foot .place { font-size:calc(10px * var(--fs)); font-weight:500; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0; }
/* ---- project groups inside a lane */
.cell { gap:14px; }
.pgroup { display:flex; flex-direction:column; gap:8px; }
.pgroup-head { display:flex; align-items:center; gap:6px; padding:0 2px; height:14px; }
.pgroup-head .pdot { width:6px; height:6px; border-radius:3px; flex:0 0 6px; }
.pgroup-head .pname { font-size:calc(10.5px * var(--fs)); font-weight:600; letter-spacing:.3px; color:var(--faint); white-space:nowrap; overflow:hidden; min-width:0; }
.pgroup-head .pcount { font-size:calc(10px * var(--fs)); color:var(--dim); margin-left:auto; }
.card .repo { font-size:calc(10px * var(--fs)); font-weight:500; white-space:nowrap; overflow:hidden; min-width:7ch; flex:0 100 auto; }
.chip { font-size:calc(10px * var(--fs)); font-weight:500; padding:1.5px 6px; border-radius:3px; white-space:nowrap; color:var(--dim); flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.chip.link { color:var(--s-unreachable); background:color-mix(in srgb, var(--s-unreachable) 16%, transparent); }
.chip.host.actionable { color:var(--attention); background:color-mix(in srgb, var(--attention) 16%, transparent); cursor:pointer; }
.chip.quota.exhausted { color:var(--quota-blocked); background:color-mix(in srgb, var(--quota-blocked) 16%, transparent); }
.chip.quota.low { color:var(--attention); background:color-mix(in srgb, var(--attention) 16%, transparent); }
.mark { width:16px; height:16px; flex:0 0 16px; background-color:var(--harness); -webkit-mask:var(--m) center / 15px 15px no-repeat; mask:var(--m) center / 15px 15px no-repeat; }
/* Titles, project headers and done rows set in a monospace: the titles are task
   slugs in a terminal tool, and the face matches the terminal behind every card.
   13.5px medium, looser leading on wrapped lines. */
:root { --t-size:13.5px; --t-lh:1.3; }
.card .title, .pgroup-head .pname, .dtitle { font-family:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:-.3px; }
.card .title { font-size:calc(var(--t-size) * var(--fs)); font-weight:500; line-height:var(--t-lh); color:var(--text); max-height:calc(3 * var(--t-lh) * 1em); overflow:hidden; overflow-wrap:anywhere; margin-top:-1px; }
.card .title.untitled { color:var(--muted); }
.card .dur { display:inline-flex; align-items:center; gap:3px; font-size:calc(10px * var(--fs)); color:var(--faint); }
.card .dur svg { width:10px; height:10px; color:var(--s-running); animation:heartbeat 1.35s ease-in-out infinite; transform-origin:center; }
.card .aging { position:absolute; left:6px; bottom:2px; height:3px; border-radius:1.5px; pointer-events:none; }
.card .check { font-family:var(--mono); font-size:calc(11px * var(--fs)); color:var(--s-done); }
.card .dtitle { font-size:calc(13px * var(--fs)); color:var(--muted); line-height:1.2; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.card .drepo { font-size:calc(10px * var(--fs)); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card.arrive { animation:arrive .2s var(--ease); }
.card.arrive .check { animation:pop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes arrive { from { opacity:0; transform:translateY(-6px); } }
@keyframes pop { from { transform:scale(.6); } }
@keyframes pulse { from { opacity:1; } to { opacity:.35; } }
@keyframes heartbeat { 0%{transform:scale(1);opacity:.72} 12%{transform:scale(1.2);opacity:1} 24%{transform:scale(.96);opacity:.8} 38%{transform:scale(1.1);opacity:1} 100%{transform:scale(1);opacity:.72} }

/* ---------- quota panel */
#quota { flex:0 0 280px; width:280px; border-left:1px solid var(--hairline); display:flex; flex-direction:column; overflow:auto; padding:12px 20px 20px; gap:28px; }
#root.dock-bottom #quota { flex:0 0 auto; width:auto; max-height:40%; border-left:0; border-top:1px solid var(--hairline); flex-direction:row; align-items:flex-start; }
.q-title { height:28px; display:flex; align-items:center; justify-content:center; width:240px; margin-bottom:-18px; }
.q-card { width:240px; flex:0 0 240px; display:flex; flex-direction:column; }
.q-block { display:flex; flex-direction:column; gap:6px; }
.q-prov { display:flex; align-items:center; gap:8px; min-width:0; }
.q-prov .mark { flex:0 0 16px; }
.q-name { font-size:calc(11px * var(--fs)); font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-name .acct { color:var(--muted); font-weight:400; }
.q-tally { margin-left:auto; font-size:calc(10px * var(--fs)); color:var(--faint); white-space:nowrap; }
.q-tally .work { color:var(--s-running); } .q-tally .wait { color:var(--needs); font-weight:600; }
.q-div { height:1px; background:var(--hairline); margin:10px 0; }
.q-gauges { display:flex; gap:14px; }
.q-cell { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:3px; }
.q-lbl { font-size:calc(9.5px * var(--fs)); font-weight:600; letter-spacing:.6px; color:var(--faint); height:16px; line-height:12px; text-align:center; border-bottom:1px solid var(--hairline); padding-bottom:3px; margin-bottom:1px; }
.q-none { font-size:calc(10px * var(--fs)); color:var(--dim); }
.bar { position:relative; width:100%; height:18px; border-radius:5px; background:var(--gauge-track); overflow:hidden; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--text) 12%, transparent); }
.bar .lbl { position:absolute; left:7px; right:7px; top:0; height:18px; line-height:18px; font-size:calc(11px * var(--fs)); font-weight:600; font-variant-numeric:tabular-nums; color:var(--text); white-space:nowrap; }
.bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px; overflow:hidden; }
.bar .fill .lbl { color:var(--gauge-label-on-fill); right:auto; width:240px; }
.bar.unknown .lbl { color:var(--faint); }
.bar.measuring .fill { width:100%; background:color-mix(in srgb, var(--shimmer) 10%, transparent); }
.bar.measuring .sweep { position:absolute; top:0; bottom:0; width:40%; border-radius:5px; background:color-mix(in srgb, var(--shimmer) 22%, transparent); animation:sweep 2.8s ease-in-out infinite; }
.bar .fill.t-healthy { background:var(--gauge-healthy); } .bar .fill.t-constrained { background:var(--gauge-constrained); } .bar .fill.t-critical { background:var(--gauge-critical); }
@keyframes sweep { from { left:-35%; } to { left:118%; } }
.q-reset { font-size:calc(10px * var(--fs)); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:13px; line-height:13px; }
.q-reset.hot { color:var(--muted); font-weight:600; }

/* ---------- pomodoro: the operator's ring owns the bottom of the quota lane (idea 5) */
.q-you { --ring:168px; margin-top:auto; width:240px; display:flex; flex-direction:column; align-items:center; gap:9px; padding-bottom:4px; }
#root.dock-bottom .q-you { --ring:112px; margin-top:0; margin-left:auto; flex:0 0 240px; }
.ring { position:relative; width:var(--ring); height:var(--ring); cursor:pointer; --arc:var(--s-running); }
.ring svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.ring .track { fill:none; stroke:var(--gauge-track); stroke-width:3; }
.ring .arc { fill:none; stroke:var(--arc); stroke-width:6; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke .6s linear; }
.ring .tick { stroke:var(--faint); stroke-width:1.2; stroke-linecap:round; transition:opacity .6s, stroke .6s; } .ring .tick.gone { opacity:.18; }
.ring .head { fill:var(--arc); transition:fill .6s linear; }
.ring.paused .arc { stroke-dasharray:4 7 !important; filter:none; stroke-width:3; } .ring.idle .head { display:none; }
.ring.idle .track { stroke-dasharray:2 6; } .ring.idle .arc { display:none; } .ring.idle:hover .track { stroke:var(--dim); }
.ring.break { --arc:var(--dim); } .ring.break .arc { filter:none; stroke-width:3; } .ring.hold { --arc:var(--attention); }
.ring .inside { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; pointer-events:none; }
.time { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:-.04em; line-height:1; color:var(--text); }
.ring .time { font-size:calc(var(--ring) * .2); } .ring.idle .time { color:var(--faint); font-weight:500; }
.ring .ph { font-family:var(--mono); font-size:12px; letter-spacing:2px; color:color-mix(in srgb, var(--text) 78%, transparent); text-transform:uppercase; } .ring.idle .ph { color:color-mix(in srgb, var(--text) 55%, transparent); } .ring.hold .ph { color:var(--attention); }
.q-you .onc { width:100%; text-align:center; font-size:13.5px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:-2px; } .q-you .onc i { font-style:normal; font-weight:400; color:color-mix(in srgb, var(--text) 62%, transparent); }
#root.dock-bottom .q-you .onc, #root.dock-bottom .ring .ph { display:none; }
.q-you .under { width:100%; display:flex; align-items:center; gap:8px; font-size:13px; } .q-you .under .q-name { font-size:13px; font-weight:600; color:var(--text); } .q-you .under .q-tally { font-size:13px; color:color-mix(in srgb, var(--text) 72%, transparent); } .q-you .dots { font-size:12px; letter-spacing:3px; color:color-mix(in srgb, var(--text) 45%, transparent); } .q-you .dots b, .rest-card .dots b { color:var(--s-running); font-weight:400; }
.q-you .q-tally { margin-left:auto; }
.q-you .ctl { font-family:var(--mono); font-size:12px; color:color-mix(in srgb, var(--text) 62%, transparent); cursor:pointer; } .q-you .ctl:hover { color:var(--text); }
.q-you .q-hint { width:100%; font-size:13px; color:var(--attention); cursor:pointer; text-align:center; } .q-you .q-hint:hover { text-decoration:underline; }
.q-you .q-held { width:100%; font-size:13px; color:color-mix(in srgb, var(--text) 78%, transparent); text-align:center; }
/* rest (idea 2): the board blurs; a breathing halo and slow ripples make the room exhale; the agents underneath keep running */
#rest { position:absolute; inset:0; z-index:58; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(18px) saturate(.6); -webkit-backdrop-filter:blur(18px) saturate(.6); background:color-mix(in srgb, var(--canvas) 62%, transparent); }
.rest-card { position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 48px; }
.rest-card .ring { --ring:280px; cursor:default; --arc:var(--dim); } .rest-card .ring .arc { filter:none; stroke-width:3; } 
.rest-card .ring .time { font-size:60px; } .rest-card .ring .ph { font-size:13px; }
.rest-card .breath { position:absolute; left:50%; top:50%; width:280px; height:280px; margin:-140px 0 0 -140px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--s-running) 20%, transparent) 0%, color-mix(in srgb, var(--s-running) 7%, transparent) 45%, transparent 70%); animation:breathe 8s ease-in-out infinite; pointer-events:none; }
@keyframes breathe { 0%,100% { transform:scale(.82) } 50% { transform:scale(1.18) } }
.rest-card .ripple { position:absolute; left:50%; top:50%; width:280px; height:280px; margin:-140px 0 0 -140px; border-radius:50%; border:1px solid var(--faint); opacity:0; animation:ripple 8s cubic-bezier(.2,.6,.3,1) infinite; pointer-events:none; } .rest-card .ripple.r2 { animation-delay:4s; }
@keyframes ripple { 0% { transform:scale(1); opacity:.5 } 100% { transform:scale(1.75); opacity:0 } }
.rest-card .inout { font-family:var(--mono); font-size:12px; letter-spacing:3px; color:color-mix(in srgb, var(--text) 60%, transparent); text-transform:uppercase; } .rest-card .inout::after { content:"breathe in"; animation:inout 8s steps(1) infinite; } @keyframes inout { 0% { content:"breathe in" } 50% { content:"breathe out" } }
.rest-card.over .ring { --arc:var(--attention); } .rest-card.over .ring .arc { filter:drop-shadow(0 0 10px color-mix(in srgb, var(--attention) 60%, transparent)); animation:glow 1.6s ease-in-out infinite alternate; } @keyframes glow { from { opacity:.55 } to { opacity:1 } }
.rest-card .dots { font-size:11px; letter-spacing:6px; color:var(--faint); }
.rest-card .held { font-size:14px; color:var(--text); }
.rest-card .agents { display:flex; align-items:center; gap:8px; font-size:13px; color:color-mix(in srgb, var(--text) 70%, transparent); } .rest-card .agents .live { display:inline-flex; gap:5px; } .rest-card .agents .live i { width:6px; height:6px; border-radius:50%; background:var(--s-running); animation:beat 1.8s ease-in-out infinite; } .rest-card .agents .live i:nth-child(2) { animation-delay:.3s } .rest-card .agents .live i:nth-child(3) { animation-delay:.6s } .rest-card .agents .live i:nth-child(4) { animation-delay:.9s }
@keyframes beat { 0%,100% { opacity:.35; transform:scale(.8) } 50% { opacity:1; transform:scale(1.1) } }
.rest-card .early { margin-top:4px; font-family:var(--mono); font-size:12px; color:color-mix(in srgb, var(--text) 70%, transparent); cursor:pointer; border:1px solid var(--hairline); border-radius:6px; padding:4px 10px; } .rest-card .early:hover { color:var(--text); }
.rest-card .tray { display:flex; flex-direction:column; gap:6px; width:400px; margin-top:4px; }
.rest-card .tray .row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--stroke); border-radius:8px; padding:9px 12px; cursor:pointer; font-size:12px; min-width:0; } .rest-card .tray .row:hover { background:var(--card-raised); }
.rest-card .tray .row .pdir { font-family:var(--mono); font-size:10px; color:var(--faint); flex:0 0 auto; } .rest-card .tray .row .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .rest-card .tray .row .wait { margin-left:auto; font-size:10px; color:var(--needs); font-weight:600; flex:0 0 auto; }
.rest-card .next { margin-top:6px; }

/* ---------- drill-in takeover */
#drill { position:absolute; inset:0; background:var(--term-bg);   /* one surface: the titlebar takes the terminal's paper */ display:flex; flex-direction:column; }
.pill { font-family:var(--mono); font-size:calc(11px * var(--fs)); font-weight:600; height:26px; line-height:26px; padding:0 12px; border-radius:6px; background:var(--card-raised); color:var(--text); cursor:pointer; white-space:nowrap; }
/* ---------- the terminal (TerminalSurface): monospaced system font, a 9pt inset,
   no scrollbar, a translucent block cursor that never blinks, URLs and paths with a
   1pt underline in the link ink, selection in the brand blue at 32%. Claude Code is
   painted with the "sich" Claude theme (ClaudeTheme.swift): its ink and paper are
   the terminal's, its orange is the board's attention colour, and every other hue
   comes from the ANSI ramp that the emulator resolves for this appearance. */
:root { --ansi-magenta:#A8317B; --ansi-cyan:#0E7C6E; --c-accept:#8700FF; --diff-add:#69DB7C; --diff-del:#FFA8B4; --diff-ink:#24313A; --end-ink:#8E8E93; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ansi-magenta:#B294BB; --ansi-cyan:#8ABEB7; --c-accept:#AF87FF; --diff-add:#225C2B; --diff-del:#7A2936; --diff-ink:#FFFFFF; --end-ink:#98989D; } }
:root[data-theme="dark"] { --ansi-magenta:#B294BB; --ansi-cyan:#8ABEB7; --c-accept:#AF87FF; --diff-add:#225C2B; --diff-del:#7A2936; --diff-ink:#FFFFFF; --end-ink:#98989D; }
/* The header IS the window's unified toolbar (NSToolbar, .unified, title hidden): the
   traffic lights, a navigational "‹ Board" item on the leading edge, and the task in a
   centred item (NSToolbar.centeredItemIdentifiers) — the title, then where it runs, on one line, centred on
   the window so it reads first wherever you land. System font; the rest stays draggable. */
.d-head { container-type:inline-size; position:relative; display:flex; align-items:center; height:52px; flex:0 0 52px; padding:0 16px 0 20px; min-width:0; }
.lights { display:flex; gap:8px; flex:0 0 auto; margin-right:14px; }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18); }
.lights i:nth-child(1) { background:#FF5F57; } .lights i:nth-child(2) { background:#FEBC2E; } .lights i:nth-child(3) { background:#28C840; }
.d-back { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px 0 9px; border-radius:7px; font:500 13px var(--sans); color:var(--muted); background:color-mix(in srgb, var(--text) 6%, transparent); cursor:default; flex:0 0 auto; white-space:nowrap; }
.d-back:hover { color:var(--text); background:color-mix(in srgb, var(--text) 11%, transparent); } .d-back:active { background:color-mix(in srgb, var(--text) 16%, transparent); }
.d-back kbd { font:400 11px var(--sans); color:var(--dim); margin-left:2px; }
.d-name { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); max-width:calc(100% - 2 * 190px);   /* clear of the lights + Board on the left, mirrored on the right */ display:flex; align-items:baseline; gap:10px; pointer-events:none;
  padding:6px 14px; border-radius:9px; background:color-mix(in srgb, var(--text) 7%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--text) 6%, transparent); }   /* a quiet plate, like Safari's centred field */
.d-title { flex:0 0 auto; max-width:100%; font:600 16px/19px var(--sans); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.d-dir { flex:0 1 auto; min-width:0; font:400 13px/19px var(--sans); color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; }   /* the title keeps its width; the folder gives way first */
@container (max-width: 820px) { .d-dir { display:none; } }   /* too narrow for both: the plate holds the title alone */
.term-wrap { position:relative; flex:1 1 0; min-height:0; margin:0 6px; background:var(--term-bg); }
.term { position:absolute; inset:0; outline:0; color:var(--term-fg); font-family:var(--mono); font-size:var(--term-fs); line-height:1.2; padding:9px; overflow-y:auto; overflow-x:hidden; cursor:text; user-select:text; scrollbar-width:none; font-variant-ligatures:none; }
.term { -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px); mask-image:linear-gradient(to bottom, transparent 0, #000 16px); }   /* history slips under the titlebar instead of being sliced */
.term::-webkit-scrollbar { display:none; }
.term ::selection { background:color-mix(in srgb, var(--brand) 32%, transparent); }
.term .ln { min-height:1.2em; white-space:pre-wrap; word-break:break-all; }
.term .gr { display:grid; grid-template-columns:var(--g) minmax(0, 1fr); min-height:1.2em; }
.term .gr .gut { white-space:pre; overflow:hidden; }
.term .gr .wb { white-space:pre-wrap; overflow-wrap:anywhere; }
.term .rule, .term .dl { white-space:pre; overflow:hidden; }
.term .umsg { background:color-mix(in srgb, var(--term-fg) 7%, transparent); }
.term .composer { background:color-mix(in srgb, var(--term-fg) 5%, transparent); }
.term .dl.add { background:var(--diff-add); color:var(--diff-ink); } .term .dl.del { background:var(--diff-del); color:var(--diff-ink); }
.term .b { font-weight:700; }
.term .k-claude { color:var(--attention); } .term .k-dim { color:var(--dim); } .term .k-subtle { color:var(--faint); } .term .k-border { color:var(--stroke-strong); }
.term .k-perm { color:var(--ansi-blue); } .term .k-ok { color:var(--ansi-green); } .term .k-err { color:var(--ansi-red); } .term .k-warn { color:var(--ansi-yellow); }
.term .k-bash { color:var(--ansi-magenta); } .term .k-plan { color:var(--ansi-cyan); } .term .k-accept { color:var(--c-accept); }
.term .lnk { text-decoration:underline 1px var(--term-link); text-underline-offset:.24em; }
.term.meta .lnk { cursor:pointer; }
.term .cur { background:color-mix(in srgb, var(--term-cursor) 55%, transparent); }
.term .endb { color:var(--end-ink); }
.jump, .t-toast { position:absolute; bottom:9px; font:500 11px var(--sans); color:var(--muted); background:var(--card-raised); border:1px solid var(--stroke-strong); border-radius:999px; padding:4px 10px; white-space:nowrap; }
.jump { right:9px; cursor:pointer; }
.t-toast { left:9px; font-family:var(--mono); pointer-events:none; }

/* ---------- archive page */
#archive { position:absolute; inset:0; background:var(--canvas); display:flex; flex-direction:column; }
#archive .pill { position:absolute; left:16px; top:10px; }
.a-scroll { flex:1; overflow:auto; padding-top:52px; }
.a-col { width:min(560px, calc(100% - 80px)); margin:4px auto 0; display:flex; flex-direction:column; gap:10px; }
.a-head { display:flex; align-items:center; gap:8px; }
.a-head .caps { color:var(--faint); }
.a-hint { font-size:calc(11px * var(--fs)); font-weight:500; color:var(--faint); }
.a-row { background:var(--card); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:4px; }
.a-row .title { font-size:calc(15px * var(--fs)); letter-spacing:-.2px; line-height:1.15; }
.a-meta { display:flex; align-items:center; gap:10px; }
.a-meta .proj { font-family:var(--mono); font-size:calc(10px * var(--fs)); }
.a-meta .when { font-size:calc(11px * var(--fs)); font-weight:500; color:var(--faint); }
.pill.small { height:22px; line-height:22px; padding:0 10px; }

/* ---------- task switcher */
/* TaskSwitcherOverlay: a dimmed board, a 720pt panel; colour carries information only —
   the chosen row is the one filled plate (brand-tinted, brand edge), a waiting card a 7pt red flag. */
:root { --sel:color-mix(in srgb, var(--brand) 22%, #FFFFFF); --scrim:rgba(0,0,0,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sel:color-mix(in srgb, var(--brand) 30%, #282C34); --scrim:rgba(0,0,0,.35); } }
:root[data-theme="dark"] { --sel:color-mix(in srgb, var(--brand) 30%, #282C34); --scrim:rgba(0,0,0,.35); }
#switcher { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--scrim); }
.sw-panel { width:min(720px, calc(100% - 40px)); margin-top:-80px; background:var(--card); border:1px solid var(--stroke-strong); border-radius:16px; box-shadow:0 10px 32px rgba(0,0,0,.4); padding:12px; display:flex; flex-direction:column; gap:4px; }
.sw-row { display:flex; align-items:center; gap:10px; padding:11px 14px 11px 12px; border-radius:9px; border:2px solid transparent; min-width:0; }
.sw-row.hl { background:var(--sel); border-color:var(--brand); }
.sw-row .flag { width:7px; height:7px; border-radius:50%; flex:0 0 7px; margin-right:-2px; } .sw-row.needs .flag { background:var(--needs); }
.sw-row { gap:16px; padding:12px 16px 12px 14px; } .sw-row .flag { margin-right:-6px; }
.sw-row .t { font:500 17px var(--sans); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; } .sw-row.hl .t { font-weight:600; }
.sw-row .p { font:13px var(--sans); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 100 auto; min-width:0; }   /* the folder gives way before the title */

.sw-sep { height:1px; background:var(--stroke); margin:4px 12px; }
.sw-hint { font:12px var(--sans); color:var(--dim); text-align:center; padding-top:6px; }

/* ---------- create palette */
#palette { position:absolute; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; }
.pal { width:560px; background:var(--card); border:1px solid var(--stroke-strong); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.55); padding-bottom:8px; }
.pal-head { display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--hairline); }
.pchip { font-family:var(--mono); font-size:10px; padding:3px 7px; border-radius:4px; border:1px solid var(--stroke); color:var(--faint); background:var(--canvas); }
.pchip.cur { color:var(--attention); border-color:color-mix(in srgb, var(--attention) 50%, transparent); background:color-mix(in srgb, var(--attention) 10%, transparent); }
.pal-body { display:flex; flex-direction:column; gap:2px; padding:6px 8px; }
.sec { font-family:var(--mono); font-size:9px; font-weight:600; color:var(--faint); padding:6px 10px 3px; }
.prow { display:flex; flex-direction:column; gap:4px; padding:9px 10px; border-radius:7px; border:1px solid transparent; margin:0 8px; cursor:default; }
.prow .h { display:flex; align-items:center; gap:10px; }
.prow .g { font-family:var(--mono); font-size:9px; width:14px; color:var(--dim); }
.prow .t { font-size:12px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prow .t.muted { color:var(--muted); }
.prow .sub { font-family:var(--mono); font-size:10px; color:var(--dim); padding-left:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prow.sel { background:color-mix(in srgb, var(--attention) 8%, transparent); border-color:color-mix(in srgb, var(--attention) 27%, transparent); }
.prow.sel .g { color:var(--attention); } .prow.sel .sub { color:#B39A6E; }
.prow .meta { font-family:var(--mono); font-size:9px; color:var(--dim); flex:0 0 auto; cursor:pointer; } .prow.sel .meta { color:#B39A6E; }
/* CreateCardPalette.folderScroll: the folder list scrolls past folderListMaxHeight (420). */
.pfolders { display:flex; flex-direction:column; gap:2px; max-height:420px; overflow-y:auto; }
.pfield { margin:0 8px; border:1px solid var(--stroke-strong); border-radius:8px; background:var(--canvas); padding:9px 11px; }
.pfield.focus { border-color:var(--attention); }
.pfield input { width:100%; border:0; background:none; outline:0; font:13px var(--sans); color:var(--text); }
.pfield input::placeholder { color:var(--dim); }
.ptoggle { margin:0 8px; display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:9px; border:1px solid var(--stroke-strong); background:var(--canvas); cursor:default; }
.ptoggle.on { background:color-mix(in srgb, var(--attention) 6%, transparent); border-color:color-mix(in srgb, var(--attention) 40%, transparent); }
.ptoggle .box { width:20px; height:20px; border-radius:5px; border:1.5px solid var(--faint); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; color:transparent; }
.ptoggle.on .box { background:var(--attention); border-color:var(--attention); color:var(--canvas); }
.ptoggle .t { font-size:12px; font-weight:600; color:var(--muted); } .ptoggle.on .t { color:var(--text); }
.ptoggle .sub { font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:2px; }
.perr { font-family:var(--mono); font-size:11px; color:var(--alert); padding:0 16px 6px; }
.pal-foot { font-family:var(--mono); font-size:9px; color:var(--muted); padding:8px 16px 0; border-top:1px solid var(--hairline); white-space:pre; }

/* ---------- context menu (macOS-ish) */
#ctx { position:absolute; z-index:50; min-width:200px; background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(20px); border:1px solid var(--stroke); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.3); padding:5px; font-size:13px; }
.mi { position:relative; padding:4px 22px 4px 12px; border-radius:5px; white-space:nowrap; display:flex; justify-content:space-between; gap:20px; }
.mi:hover { background:var(--brand); color:#fff; }
.mi.off { color:var(--dim); pointer-events:none; }
.mi.sub::after { content:"›"; position:absolute; right:8px; }
.msep { height:1px; background:var(--hairline); margin:5px 8px; }
.mi .submenu { display:none; position:absolute; left:100%; top:-6px; margin-left:-2px; min-width:160px; background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(20px); border:1px solid var(--stroke); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.3); padding:5px; color:var(--text); }
.mi:hover > .submenu { display:block; }

/* ---------- modal sheet (NSAlert stand-in) */
#sheet { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); z-index:60; }
.alert { width:420px; background:var(--card); border:1px solid var(--stroke); border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.4); padding:20px; display:flex; flex-direction:column; gap:10px; }
.alert h2 { font-size:13px; font-weight:700; }
.alert p { font-size:11px; color:var(--muted); line-height:1.4; }
.alert input { font:13px var(--sans); padding:7px 9px; border:1px solid var(--stroke-strong); border-radius:6px; background:var(--canvas); color:var(--text); outline:0; }
.alert input:focus { border-color:var(--brand); }
.abtns { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
.abtn { font-size:12px; padding:5px 14px; border-radius:6px; background:var(--card-raised); border:1px solid var(--stroke); min-width:72px; }
.abtn.primary { background:var(--brand); color:#fff; border-color:transparent; }
.abtn.danger { color:var(--alert); }

/* ---------- demo pill (not part of the app: theme + simulation for playing) */
#demo { position:absolute; left:10px; bottom:10px; z-index:70; font-family:var(--mono); font-size:10px; }
#demo > button { color:var(--dim); background:color-mix(in srgb, var(--canvas) 85%, transparent); border:1px solid var(--hairline); border-radius:6px; padding:3px 8px; }
#demo .menu { position:absolute; left:0; bottom:26px; background:var(--card); border:1px solid var(--stroke); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.3); padding:6px; min-width:210px; display:flex; flex-direction:column; gap:2px; }
#demo .menu button { text-align:left; padding:5px 8px; border-radius:5px; font-family:var(--mono); font-size:11px; display:flex; justify-content:space-between; gap:12px; }
#demo .menu button:hover { background:var(--card-raised); }
#drill:not([hidden]) ~ #demo:not(:hover):not(:focus-within) { opacity:.25; }   /* stays out of the terminal's way */
#demo .menu .on::after { content:"on"; color:var(--s-done); }

@media (prefers-reduced-motion: reduce) {
  /* Honoured like NSWorkspace.accessibilityDisplayShouldReduceMotion — unless the
     demo pill forces motion on (data-motion="full"), so animations can be judged
     on a Mac that has Reduce Motion enabled. */
  :root:not([data-motion="full"]) :is(.card, .card .dur svg, .lane .dot, .bar.measuring .sweep, .card.arrive, .card.arrive .check, .pgroup-head.arrive, .lane, .lane-head .caps, .sym svg),
  :root:not([data-motion="full"]) .card::before, :root:not([data-motion="full"]) .lane .dot::after, :root:not([data-motion="full"]) .lane::after { animation:none !important; transition:none !important; }
  /* Reduced motion is not no feedback: the working glyph keeps a slow opacity
     breathe (nothing moves or grows), so a WORKING card still reads as alive. */

  switch (c.state) {
    case "running":

    case "runningTests":

    case "waitingForInput":

    case "blocked":

/* ---------- a turn: a list of timed steps; an ask pauses it until you answer */
const step = (ms, fn) => Object.assign(fn, { ms });
function workSteps(c, { from = "intro", askEdit = false } = {}) {
  const w = workFor(c), T = () => tui(c), t = c.tty;
  const all = [
    ["intro", step(900, () => push(c, T().say("I'll start with how this works today."), blank()))],
    ["read", step(800, () => push(c, T().tool("Read", w.read), T().out(`Read ${180 + w.read.length * 3} lines`), blank()))],
    ["search", step(900, () => push(c, T().tool("Search", `pattern: "${w.find}"`), T().out(`Found ${3 + w.find.length % 5} files`), blank()))],
    ["plan", step(700, () => {
      if (t.perm !== "plan" || t.agent !== "claude") return;
      push(c, T().say("Here's the plan:"), gr("", 2, `1. Read ${L(w.read)} to see the current shape`), gr("", 2, `2. Change ${L(w.edit)}`), gr("", 2, `3. Run ${esc(w.test)}`), blank());
      return ask(c, { title:"Ready to code?", body:[], question:"Would you like to proceed?", options:["Yes, and auto-accept edits", "Yes, and manually approve edits", "No, keep planning"],
        onPick: i => { if (i === 2) return "stop"; t.perm = i === 0 ? "acceptEdits" : "default"; } });
    })],
    ["edit", step(askEdit ? 0 : 1000, () => {
      const count = (kind, word) => { const n = w.diff.filter(d => d[0] === kind).length; return `${n} ${word}${n === 1 ? "" : "s"}`; };
      const apply = () => push(c, T().tool("Update", w.edit), T().out(`Updated <span class="b">${esc(w.edit)}</span> with ${count("add", "addition")} and ${count("del", "removal")}`), ...diffRows(w.diff), blank());
      if (!askEdit && (t.perm === "acceptEdits" || t.perm === "auto")) return apply();
      askEdit = false;
      return ask(c, { ...T().askEdit(w), onPick: i => {
        if (i === 2) { push(c, T().tool("Update", w.edit), T().out(`<span class="k-err">User rejected update to ${esc(w.edit)}</span>`), blank()); return "stop"; }
        if (i === 1) { if (t.agent === "claude") t.perm = "acceptEdits"; else t.allowEdits = true; }

    })],
    ["bash", step(900, () => {
      const run = () => { push(c, T().tool("Bash", w.test)); hook(c, "runningTests"); };
      if (t.perm === "auto" || t.allowBash) return run();
      return ask(c, { ...T().askBash(w, c), onPick: i => {
        if (i === 2) { push(c, T().tool("Bash", w.test), T().out(`<span class="k-err">User rejected the command</span>`), blank()); return "stop"; }
        if (i === 1) t.allowBash = true;

    ["bashEnd", step(1700, () => { push(c, T().out(esc(w.pass)), blank()); hook(c, "running"); })],
    ["done", step(900, () => push(c, T().say(esc(w.done)), blank()))],

}
function startTurn(c, steps, startedAt = now(), opts = {}) {

/* ---------- submitting */

    const cmd = text.slice(1).trim();

function usageRows() {

  const row = (name, g) => g ? ln(`  ${name.padEnd(26)}${bar(1 - g.remaining)}  ${Math.round((1 - g.remaining) * 100)}% used <span class="k-subtle">· resets in ${timeLeft(g.reset - now())}</span>`)

  if (cmd === "pwd") return [L(c.remote ? `/home/${c.remote.split("@")[0]}` : tilde(c.projectDir).replace(/^~/, "/Users/you"))];

/* ---------- keys. ⌘ chords belong to the app (⌘[ back, ⌘= zoom, ⌘C copy); Esc

function termKey(e) {
  const c = cards.find(x => x.id === drilledID); if (!c) return;
  const t = c.tty, term = drillEl.querySelector(".term");
  if (e.metaKey || e.key === "Meta") return;
  if (t.ended != null) return;
  const sel = getSelection(); if (!sel.isCollapsed && !["Shift","Control","Alt"].includes(e.key)) sel.removeAllRanges();   // a keystroke ends a selection
  if (t.ask && t.mode === "agent") {
    const a = t.ask, n = a.options.length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") a.sel = (a.sel + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
    else if (/^[1-9]$/.test(e.key) && +e.key <= n) pick(c, +e.key - 1);
    else if (e.key === "Enter") pick(c, a.sel);
    else if (e.key === "Escape") pick(c, n - 1);
    else if (e.key === "Tab" && e.shiftKey) pick(c, 1);

    if (t.mode === "shell") { push(c, ln(esc(shellPrompt(c)) + esc(t.input) + "^C")); t.input = ""; return renderTerm(c, true); }
    if (t.input) { t.input = ""; return renderTerm(c, true); }

    else if (!e.shiftKey && slash.length) t.input = slash[Math.min(t.slash, slash.length - 1)][0] + " ";

  const sel = getSelection();
  if (!toBottom && !sel.isCollapsed && term.contains(sel.anchorNode)) { heldRender = true; return; }
  heldRender = false;
  const stick = toBottom || term.dataset.stick === "1" || atBottom(term);

   Archive page
   ====================================================================== */

/* ========================================================================
   Task switcher (Ctrl+Tab in the app; browsers own Ctrl+Tab, so Ctrl+` too)
   ====================================================================== */
const switcherEl = $("#switcher");

  const ranked = cards.map((c, i) => ({ c, i, r: mru.indexOf(c.id) < 0 ? Infinity : mru.indexOf(c.id) })).sort((a, b) => a.r === b.r ? a.i - b.i : a.r - b.r).map(x => x.c);

    const other = reverse ? switcherList.map(c => c.id).lastIndexOf(switcherList.find(c => c.id !== drilledID)?.id) : switcherList.findIndex(c => c.id !== drilledID);
    switcherIdx = Math.max(0, other); switcherOpen = true;

  renderSwitcher();

    const dir = leaf(c.remote ? (c.remoteDir || c.remote) : c.projectDir);   // the folder's name only — a predictable length
    html += `<div class="sw-row${needs ? " needs" : ""}${i === switcherIdx ? " hl" : ""}"><span class="flag"></span><span class="t">${esc(c.title ?? shortPath(c.projectDir))}</span><span class="spring"></span><span class="p">${esc(dir)}</span></div>`;

/* ========================================================================

   ====================================================================== */
let standupOpen = false;
async function standupIfNeeded() {

  const ageText = h >= 48 ? `${Math.floor(h/24)}d ${h%24}h` : h >= 1 ? `${h}h ${m}m` : `${Math.max(1,m)}m`;
  const v = await sheet({ title: `NEEDS YOU — ${stale.title ?? stale.projectDir}`, text: `This task has been waiting ${ageText}. Rule 1: respond, defer to queue until tomorrow, or mark done — don't leave it abandoned.`, buttons: [{ label: "Mark done", value: "done" }, { label: "Defer to queue until tomorrow", value: "defer" }, { label: "Respond now", value: "respond", primary: true }] });

/* ========================================================================
   Keyboard — the shell's local monitor: ⌘N, ⌘= / ⌘−, ⌘[, arrows, Return, Esc,
   Ctrl+Tab / Ctrl+` (switcher), Control release commits.
   ====================================================================== */
document.addEventListener("keydown", e => {
  if (!sheetEl.hidden) return;
  if (!restEl.hidden) { if (e.key === "Escape" && pomo.over) pomoEndBreakEarly(); e.preventDefault(); return; }
  const meta = e.metaKey && !e.ctrlKey && !e.altKey;
  if (meta && e.key.toLowerCase() === "n") { e.preventDefault(); if (!pal) openPalette(); return; }
  if (meta && (e.key === "=" || e.key === "+")) { e.preventDefault(); return zoomFont(1); }
  if (meta && e.key === "-") { e.preventDefault(); return zoomFont(-1); }
  if (e.ctrlKey && !e.metaKey && (e.key === "Tab" || e.key === "`")) { e.preventDefault(); return advanceSwitcher(e.shiftKey); }
  if (switcherOpen) { if (e.key === "Escape") { e.preventDefault(); closeSwitcher(); } return; }
  if (pal) {
    if (e.key === "Escape") { e.preventDefault(); return closePalette(); }
    if (e.key === "Enter") { e.preventDefault(); return palActivate(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); return palArrow(e.key === "ArrowDown" ? 1 : -1); }
    if (pal.stage === "project") {   // the folder field: tab completes, → opens, ⌫ on an empty field goes back
      if (e.key === "Tab") { e.preventDefault(); return completeFolder(); }
      if (e.key === "ArrowRight" && pal.sel >= 0) { e.preventDefault(); return stepInto(pal.sel); }
      if (e.key === "Backspace" && !pal.typed) { e.preventDefault(); return palBack(); }
    }
    if (e.key === "ArrowLeft" && (!document.activeElement?.value)) { e.preventDefault(); return palBack(); }
    return;
  }
  if (drilledID) {
    if (meta && e.key === "[") { e.preventDefault(); return returnToBoard(); }
    return termKey(e);
  }
  if (!archiveEl.hidden) { if (e.key === "Escape") hideArchive(); return; }
  // Board: linear focus walk + Return drills in (BoardView.keyDown)
  if (["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"].includes(e.key)) {
    e.preventDefault(); if (!cards.length) return;
    const step = (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 1;
    const i = cards.findIndex(c => c.id === focusedID);
    focusedID = cards[((i < 0 ? (step > 0 ? -1 : 0) : i) + step + cards.length) % cards.length].id;
    render(); boardEl.querySelector(".card.focused")?.scrollIntoView({ block: "nearest" });
  }

});

/* Follows docs/CARD-STATUS.md: idle → working (user launched), working → needs you (turn ended), working ↔ tests, needs you stays until answered. */
function simulate() {
  const live = cards.filter(c => !["done","parked","unreachable","unknown"].includes(c.state) && c.id !== drilledID);
  if (!live.length) return;
  const c = live[Math.floor(Math.random() * live.length)];
  const r = Math.random();
  if (c.state === "idle" && r < .6) setState(c, "running");
  else if (c.state === "running" && r < .35) setState(c, "waitingForInput");
  else if (c.state === "running" && r < .55) setState(c, "runningTests");
  else if (c.state === "runningTests" && r < .6) setState(c, "running");
  else if (c.state === "waitingForInput" && r < .25) setState(c, "running");   // the operator answered
  else if (c.state === "blocked" && r < .2) setState(c, "idle");

const POMO = { work: 25*MIN, shortBreak: 5*MIN, longBreak: 15*MIN, perCycle: 4 };
let pomoSpeed = 1;   // demo only: ×60 makes a 25-minute phase take 25 seconds
let pomo = { phase: "idle", running: false, remaining: POMO.work, total: POMO.work, completed: 3, focusToday: 75*MIN, cardID: null, segStart: 0, touched: [], hold: false, tray: [], over: false, log: [] };
const restEl = $("#rest");
const isBreak = () => pomo.phase === "shortBreak" || pomo.phase === "longBreak";
function seedHuman(list) { const h = { "Add OAuth token refresh": 50*MIN, "Aggregate quota across pools": 25*MIN, "Build the settings panel": 75*MIN }; for (const c of list) c.human = h[c.title] ?? 0; return list; }
/* Idea 1 — the card's human time is measured, never estimated: finished phases plus the one running on it now. */
function humanTime(c) { return (c.human || 0) + (pomo.phase === "work" && pomo.cardID === c.id ? pomo.total - pomo.remaining - pomo.segStart : 0); }
/* You moved to another card mid-pomodoro: the minutes so far stay with the card you
   were in, and from here they land on this one. A card you are in is never held. */
function pomoRetag(c) {
  if (pomo.phase !== "work" || pomo.cardID === c.id) return;
  const elapsed = pomo.total - pomo.remaining, prev = cards.find(x => x.id === pomo.cardID);
  if (prev) prev.human = (prev.human || 0) + elapsed - pomo.segStart;
  Object.assign(pomo, { cardID: c.id, segStart: elapsed, touched: pomo.touched.includes(c.id) ? pomo.touched : [...pomo.touched, c.id], tray: pomo.tray.filter(id => id !== c.id) });
  render();
}
function pomoDots() { const n = pomo.completed % POMO.perCycle, cur = pomo.phase === "work" ? 1 : 0; let s = ""; for (let i = 0; i < POMO.perCycle; i++) s += i < n ? "<b>●</b>" : (i === n && cur) ? "<b>◐</b>" : "○"; return s; }
function mmss(ms) { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function pomoStart(cardID = drilledID ?? lastInID ?? null) {
  Object.assign(pomo, { phase: "work", total: POMO.work, remaining: POMO.work, running: true, cardID, segStart: 0, touched: cardID ? [cardID] : [], hold: false, tray: [], over: false });
  render();
}
function pomoToggle() { if (pomo.phase === "idle") return pomoStart(); if (pomo.over) return pomoEndBreakEarly(); pomo.running = !pomo.running; renderQuota(); }
function pomoBreak(len) { Object.assign(pomo, { phase: len > POMO.shortBreak ? "longBreak" : "shortBreak", total: len, remaining: len, running: true, over: false, cardID: null }); render(); }
/* Work phase over: the elapsed minutes land on the card, then rest — unless you're
   mid-reply in a terminal, in which case the break waits for your ↵ (idea 3). */
function pomoWorkDone(early = false) {
  const spent = pomo.total - pomo.remaining, c = cards.find(x => x.id === pomo.cardID);
  if (c) c.human = (c.human || 0) + spent - pomo.segStart;
  pomo.focusToday += spent; pomo.log.push({ card: c?.title ?? null, ms: spent, at: now() });
  if (!early) pomo.completed++;
  if (!early && (cards.find(x => x.id === drilledID)?.tty?.input ?? "").trim()) { Object.assign(pomo, { running: false, hold: true, remaining: 0 }); renderQuota(); return; }
  pomoBreak(!early && pomo.completed % POMO.perCycle === 0 ? POMO.longBreak : POMO.shortBreak);
}
function pomoBreakDone() { Object.assign(pomo, { running: false, over: true, remaining: 0 }); render(); }
function pomoEndBreakEarly() { Object.assign(pomo, { phase: "idle", running: false, remaining: POMO.work, total: POMO.work, over: false }); render(); standupIfNeeded(); }
/* Ideas 2 & 4 — a card asking for you during another card's pomodoro, or during a break, waits its turn. */
function pomoNote(card, newState) {
  if (newState !== "waitingForInput") { pomo.tray = pomo.tray.filter(id => id !== card.id); return; }
  if ((pomo.phase === "work" && card.id !== pomo.cardID) || isBreak()) { if (!pomo.tray.includes(card.id)) pomo.tray.push(card.id); }
}
function pomoHeld(card) { return pomo.tray.includes(card.id) && (pomo.phase === "work" || isBreak()); }
/* Idea 3 — the timer reads the board: every agent busy and nobody needs you → rest now;
   the 5H pool spent → its refill countdown is the break. */
function pomoHint() {
  if (pomo.phase !== "work" || !pomo.running) return null;
  const g = quota.interactive_5h;
  if (g && g.state === "exhausted") { const left = g.reset - now(); if (left > 0 && left <= POMO.longBreak) return { text: `5H pool back in ${timeLeft(left)} — take that as the break?`, act: () => { pomoWorkDone(true); pomoBreak(Math.max(POMO.shortBreak, left)); } }; }
  const live = cards.filter(c => !["done","parked","unreachable","unknown","idle","blocked"].includes(c.state));
  if (live.length >= 2 && live.every(c => isWorking(c.state)) && pomo.remaining > 3*MIN && !pomo.tray.length && !drilledID) return { text: "all agents working — rest now?", act: () => pomoWorkDone(true) };
  return null;
}
/* ---------- the ring: one drawing for the dock and the rest screen, painted every frame */
const RING_R = 100, RING_C = 2 * Math.PI * RING_R;
function ringSVG() {
  const ticks = []; const n = Math.round(pomo.total / MIN) || 25;
  for (let i = 0; i < n; i++) { const a = -Math.PI/2 + 2*Math.PI*i/n, r0 = RING_R + 8, r1 = RING_R + 12 + (i % 5 === 0 ? 3 : 0);
    ticks.push(`<line class="tick" data-i="${i}" x1="${(112 + r0*Math.cos(a)).toFixed(2)}" y1="${(112 + r0*Math.sin(a)).toFixed(2)}" x2="${(112 + r1*Math.cos(a)).toFixed(2)}" y2="${(112 + r1*Math.sin(a)).toFixed(2)}"/>`); }
  return `<svg viewBox="0 0 224 224"><circle class="track" cx="112" cy="112" r="${RING_R}"/>${ticks.join("")}<circle class="arc" cx="112" cy="112" r="${RING_R}" stroke-dasharray="${RING_C} ${RING_C}"/><circle class="head" r="4"/></svg>`;
}
function timeHTML(ms) { return mmssPad(ms); }
function mmssPad(ms) { const s = Math.max(0, Math.ceil(ms/1000)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function paintRing(root) {
  if (!root) return; const p = pomo, idle = p.phase === "idle";
  const rem = idle ? 1 : p.remaining / p.total, a = -Math.PI/2 + 2*Math.PI*rem;
  const arc = root.querySelector(".arc"); arc.setAttribute("stroke-dasharray", `${(RING_C*rem).toFixed(2)} ${RING_C}`);
  const hx = (112 + RING_R*Math.cos(a)).toFixed(2), hy = (112 + RING_R*Math.sin(a)).toFixed(2);
  const head = root.querySelector(".head"); head.setAttribute("cx", hx); head.setAttribute("cy", hy);
  const minsLeft = Math.ceil(p.remaining / MIN); root.querySelectorAll(".tick").forEach(t => t.classList.toggle("gone", !idle && +t.dataset.i >= minsLeft));
  if (p.phase === "work") { const k = Math.max(0, Math.min(1, (3*MIN - p.remaining) / (3*MIN))); root.style.setProperty("--arc", k > 0 ? `color-mix(in srgb, var(--attention) ${Math.round(k*100)}%, var(--s-running))` : "var(--s-running)"); }
  const txt = mmssPad(idle ? POMO.work : p.remaining), tEl = root.querySelector(".time"); if (tEl.textContent !== txt) tEl.textContent = txt;
}
const SVG_TIMER = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:var(--faint)"><circle cx="8" cy="9" r="5.5"/><path d="M8 6.2v3l2 1.4M6 1.8h4"/></svg>`;
/* Idea 5 — the operator's ring under the providers. */
function youBlock() {
  const p = pomo, c = cards.find(x => x.id === p.cardID);
  const cls = p.hold ? "hold" : p.phase === "idle" ? "idle" : p.over ? "over" : isBreak() ? "break" : p.running ? "work" : "paused";
  const ph = p.hold ? "break waits for ↵" : p.phase === "idle" ? "start a pomodoro" : p.over ? "break over" : isBreak() ? (p.phase === "longBreak" ? "long break" : "break") : p.running ? "focus" : "paused";
  const onc = (p.phase === "work" || p.hold) ? (c ? `<i>on</i> ${esc(c.title ?? shortPath(c.projectDir))}${p.touched.length > 1 ? ` <i>· +${p.touched.length - 1} more</i>` : ""}` : `<i>no card — drill in to tag one</i>`) : isBreak() ? `<i>agents keep working</i>` : p.log.length ? `<i>last on</i> ${esc(p.log[p.log.length-1].card ?? "no card")}` : `<i>tags the card you're in</i>`;
  const hint = pomoHint();
  const held = p.tray.length ? `<div class="q-held">${p.tray.length} will need you after this ${isBreak() ? "break" : "pomodoro"}</div>` : "";
  const ctl = p.phase === "work" ? `<span class="ctl" data-pomo="skip" title="End this pomodoro now and rest">rest now ›</span>` : "";
  return `<div class="q-you"><div class="ring ${cls}" data-pomo="toggle" title="${p.phase === "idle" ? "Start a 25-minute pomodoro on the active card" : p.running ? "Pause" : "Resume"}">${ringSVG()}<div class="inside"><div class="time">${timeHTML(p.phase === "idle" ? POMO.work : p.remaining)}</div><div class="ph">${ph}</div></div></div><div class="onc">${onc}</div>` +
    `<div class="under">${SVG_TIMER}<span class="q-name">You</span><span class="dots" title="${p.completed} pomodoros today">${pomoDots()}</span><span class="q-tally">${p.completed} today · ${fmtDur(p.focusToday)}</span></div>` +
    `${ctl ? `<div class="under" style="justify-content:flex-end">${ctl}</div>` : ""}${hint ? `<div class="q-hint" data-pomo="hint">${esc(hint.text)}</div>` : ""}${held}</div>`;
}
/* Idea 2 — the rest screen: the same ring, now breathing; how many will need you as a count, and the agents still going underneath. */
function renderRest() {
  const p = pomo, show = isBreak() || p.over; restEl.hidden = !show; if (!show) { restEl.innerHTML = ""; return; }
  const working = cards.filter(c => isWorking(c.state)).length, tray = p.tray.map(id => cards.find(c => c.id === id)).filter(Boolean);
  const plural = n => `${n} task${n === 1 ? "" : "s"}`;
  const ring = `<div class="ring ${p.over ? "over" : "break"}">${ringSVG()}<div class="inside"><div class="time">${timeHTML(p.remaining)}</div><div class="ph">${p.over ? "break over" : p.phase === "longBreak" ? "long break" : "break"}</div></div></div>`;
  restEl.innerHTML = p.over
    ? `<div class="rest-card over">${ring}<div class="dots">${pomoDots()}</div>` +
      `<div class="held">${tray.length ? `${plural(tray.length)} asked for you meanwhile — pick one to start the next pomodoro on it` : "Nothing asked for you. Pick a card and start the next one."}</div>` +
      `<div class="tray">${tray.map(c => `<div class="row" data-tray="${c.id}"><span class="pdir">${esc(projectLabel(c.projectDir))}</span><span class="t">${esc(c.title ?? shortPath(c.projectDir))}</span><span class="wait">waiting ${fmtDur(now() - (c.waitingSince ?? now()))}</span></div>`).join("")}</div>` +
      `<span class="pill next" data-act="board">← board</span></div>`
    : `<div class="rest-card"><div class="breath"></div><div class="ripple"></div><div class="ripple r2"></div>${ring}<div class="inout"></div><div class="dots">${pomoDots()}</div>` +
      `<div class="held">${tray.length ? `${plural(tray.length)} will need you after the break` : "nothing needs you"}</div>` +
      `<div class="agents"><span class="live">${"<i></i>".repeat(Math.min(working, 4))}</span>${working} agent${working === 1 ? "" : "s"} still working underneath</div>` +
      `<span class="early" data-act="early">end break early</span></div>`;
  paintRing(restEl.querySelector(".ring"));
  restEl.onclick = e => {
    const r = e.target.closest("[data-tray]");
    if (r) { const c = cards.find(x => x.id === r.dataset.tray); pomo.tray = pomo.tray.filter(id => id !== c.id); Object.assign(pomo, { over: false, phase: "idle" }); drill(c); pomoStart(c.id); return; }
    if (e.target.closest("[data-act=early],[data-act=board]")) pomoEndBreakEarly();
  };
}
/* The clock: wall-time deltas on the frame callback, so the arc sweeps instead of stepping. */
let pomoLast = performance.now();
function pomoFrame(t) {
  const dt = t - pomoLast; pomoLast = t;
  if (pomo.running) {
    pomo.remaining -= dt * pomoSpeed;
    if (pomo.remaining <= 0) { pomo.remaining = 0; if (pomo.phase === "work") pomoWorkDone(); else pomoBreakDone(); requestAnimationFrame(pomoFrame); return; }
    paintRing(quotaEl.querySelector(".q-you .ring")); paintRing(restEl.querySelector(".ring"));
    if (pomo.phase === "work" && (t % 1000) < dt) { const h = pomoHint(), el = quotaEl.querySelector(".q-you .q-hint"); if (!!h !== !!el || (h && el && el.textContent !== h.text)) renderQuota(); }
  }
  requestAnimationFrame(pomoFrame);
}
requestAnimationFrame(pomoFrame);

/* ---------- boot */
function setMotion(m) { if (m === "full") document.documentElement.dataset.motion = "full"; else delete document.documentElement.dataset.motion; localStorage.setItem("board.motion", m); }
setMotion(localStorage.getItem("board.motion") || "full");
applyResponsive();
</script>
</body>
