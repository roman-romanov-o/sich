name: Release

# Push a tag like v0.1.0 (or run manually) to build Sich.app and attach it to a
# GitHub Release. App bundles are distributed ONLY as release artifacts — never
# committed to the repository.
#
# Same hosted runner as ci.yml, but NO cache: a release artifact is built from
# source end to end so nothing restored from a cache can end up in the bundle.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, package, publish
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write       # creates the GitHub Release and uploads the zip
      id-token: write       # signs the build provenance (Sigstore, keyless)
      attestations: write   # stores it on the repository
    defaults:
      run:
        working-directory: app
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app   # same toolchain as ci.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Build libghostty-vt
        run: scripts/build-ghostty-vt.sh

      # A tagged release is signed with the Developer ID certificate and notarized;
      # a manual (workflow_dispatch) build without the secrets stays ad-hoc signed.
      # The certificate goes into a throwaway keychain that exists only for this job.
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set; a tagged release must be signed and notarized."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate holds no Developer ID Application identity."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build Sich.app
        env:
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            ./make-app.sh --version "${TAG#v}" --build-number "$RUN_NUMBER" --sign "$SIGN_IDENTITY"
          else
            ./make-app.sh
          fi

      # Apple's notary service scans the bundle; the ticket is stapled so Gatekeeper
      # clears it offline too. The App Store Connect API key never touches the repo.
      - name: Notarize and staple
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error::APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8 must all be set to notarize."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          ditto -c -k --keepParent build/Sich.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 45m
          rm -f "$key" "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/Sich.app
          xcrun stapler validate build/Sich.app
          spctl --assess --type execute --verbose=2 build/Sich.app

      # ditto preserves resource forks/permissions the way Archive Utility
      # expects; a plain `zip -r` produces bundles Gatekeeper mistrusts more.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          suffix="${TAG:-dev}"
          # `universal`, not `arm64`: make-app.sh builds both macOS slices so the
          # release runs on Intel too. Keep the name honest — it is the only thing
          # a downloader can check before installing.
          ditto -c -k --keepParent build/Sich.app "build/Sich-${suffix}-universal.zip"
          shasum -a 256 "build/Sich-${suffix}-universal.zip" | tee "build/Sich-${suffix}-universal.zip.sha256"
          lipo -archs build/Sich.app/Contents/MacOS/sich

      # SLSA build provenance: a signed statement that THIS workflow, on THIS
      # commit, produced the zip. Anyone can check it before installing with
      #   gh attestation verify Sich-<tag>-universal.zip --repo roman-romanov-o/sich
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/Sich-*.zip

      # The Sigstore bundle also ships as a release asset, so the provenance can be
      # verified offline (`gh attestation verify --bundle <file>`) and release
      # scanners see the release is attested.
      - name: Stage provenance bundle
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "build/Sich-${TAG:-dev}-universal.zip.sigstore.json"

      # Creates the release if the tag has none yet, otherwise attaches to the
      # existing one (so a release drafted by hand keeps its notes).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Sich-*.zip build/Sich-*.zip.sha256 build/Sich-*.sigstore.json --clobber
          else
            gh release create "$TAG" build/Sich-*.zip build/Sich-*.zip.sha256 build/Sich-*.sigstore.json \
              --verify-tag --generate-notes
          fi

      # Manual runs still leave the zip inspectable as a workflow artifact.
      - name: Upload workflow artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sich.app
          path: |
            app/build/Sich-*.zip
            app/build/Sich-*.zip.sha256
            app/build/Sich-*.sigstore.json
