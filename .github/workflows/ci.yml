name: CI

# Every job runs on GitHub-hosted runners. The one non-obvious prerequisite is
# the vendored libghostty-vt static archives, which are git-ignored (~30 MB) and
# rebuilt here from the pinned ghostty revision with Zig 0.15.2; the result is
# cached on the pins (see app/scripts/build-ghostty-vt.sh), so only the first
# run after a pin change pays for the Zig build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      # Pin the toolchain the suite is developed and verified against (Swift 6.2).
      # The image's default Xcode 16.4 (Swift 6.1) never lets the async relay
      # tests' main-actor hops land, and macos-26 already moved on to Swift 6.3.
      # If the image drops this Xcode the first step fails loudly; bump it then.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Restore vendored libghostty-vt
        id: ghostty
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/Frameworks/ghostty-vt.xcframework/**/*.a
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/build-ghostty-vt.sh') }}

      - name: Set up Zig
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build libghostty-vt (cache miss)
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: scripts/build-ghostty-vt.sh

      # Saved right after the build, not at job end, so a later test failure
      # never throws the expensive archives away.
      - name: Cache vendored libghostty-vt
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/Frameworks/ghostty-vt.xcframework/**/*.a
          key: ${{ steps.ghostty.outputs.cache-primary-key }}

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # Two known-flaky tests are macOS races, not defects: GridTextTests
      # 'fromPTY' (PTY-EOF race) and BoardSessionMergeTests
      # 'observedSessionInAnOwnedDirIsNotDuplicated' (only under full-suite
      # concurrency). Retry once so they don't redden CI at random; a real
      # failure fails both runs.
      - name: Test
        run: |
          swift test && exit 0
          echo "::warning::swift test failed on the first run; retrying once (known PTY-EOF / suite-concurrency flakes). A genuine failure will fail this retry too."
          swift test

      # Dead-code ratchet: fails only on findings absent from
      # .periphery-baseline.json. Shrink the baseline as things get cleaned up;
      # never widen it to silence a new finding.
      # A pinned release binary, checksum-verified: the Homebrew cask lags years
      # behind and does not understand this repo's config.
      - name: Dead code (Periphery, vs. baseline)
        env:
          PERIPHERY_VERSION: "3.8.0"
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
        run: |
          curl -sSfL -o periphery.zip \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          echo "${PERIPHERY_SHA256}  periphery.zip" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/periphery" && unzip -qo periphery.zip -d "$RUNNER_TEMP/periphery"
          "$RUNNER_TEMP/periphery/periphery" version
          "$RUNNER_TEMP/periphery/periphery" scan --baseline .periphery-baseline.json --strict --format github-actions

  forwarder:
    name: Hook forwarder test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lint
        run: |
          uvx ruff check tests
          uvx ruff format --check tests
      - name: Test
        run: uv run --with pytest pytest -q tests
