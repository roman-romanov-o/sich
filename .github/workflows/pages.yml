name: Pages

# Publishes the landing page in site/ to GitHub Pages. The GIFs and video live
# once in assets/ (the README uses them too) and are copied in at deploy time.

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp assets/*.gif assets/promo.mp4 assets/sich-icon-flat.png assets/social-preview.png _site/assets/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
