name: Dependency review

# Fails a pull request that introduces a dependency with a known vulnerability
# or a disallowed licence. Today the only dependencies are the pinned GitHub
# Actions themselves (the Swift package has none), so this is mostly a tripwire
# for the day one is added.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # posts the summary comment on the PR
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
