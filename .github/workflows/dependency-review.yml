name: Dependency review

# Fails a pull request that introduces a dependency with a known vulnerability
# or a disallowed licence. Today the only dependencies are the pinned GitHub
# Actions themselves (the Swift package has none), so this is mostly a tripwire
# for the day one is added.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # posts the summary comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
