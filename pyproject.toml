# The Python mission-control sidecar was retired in the Phase-03 cutover
# (task-03-native-core): the app is now a single native Swift binary that reads
# quota in-process and tails the hook event file directly — no Python runtime,
# no localhost sidecar, no HTTP wire (DD-001 / DD-002). The Swift package lives
# in `app/`; build it with `cd app && swift build`, test with `swift test`.
#
# Only repo-level tooling config remains below (ruff for the one pytest that
# drives the bash hook forwarder). There is no Python package to build or install here.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
