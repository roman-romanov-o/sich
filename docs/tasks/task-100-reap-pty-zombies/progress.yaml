format: saha/v2
task: "task-100-reap-pty-zombies"
title: "Reap SIGKILLed pty children — PTYSession.terminate() never leaves zombies"
created: "2026-08-28"
mode: quick
status: planning

# Context (from the 2026-08-28 power drill-down):
#   ~230 <defunct> children under one Sich process after 48 h (~5/hour), in pairs —
#   the hidden /usage probes (claude / `agent --trust` / `agy`) that TUIUsageProbe
#   terminates every 5 min. Root cause: PTYSession.terminate() polls
#   waitpid(WNOHANG) for only 100 × 1 ms after SIGKILL; a Node CLI with a big heap
#   often needs longer, so childPID is set to -1 and the pid is never reaped.
#   Verify live with:  ps -Ao ppid,stat,comm | awk '$1==<sich pid> && $2 ~ /Z/'
#
# Stack: Swift (cd app && swift build / swift test; swiftlint). No probe spawns
# under swift test (HiddenTUIProbe.spawningEnabled stays false) — the regression
# test must use a plain child (/bin/sh, sleep) like PTYReadTests already does.

