stories:
  - id: US-001
    title: "terminate() never leaves a zombie"
    view: us-001-flow
    priority: must
    status: ready
    story: "As a developer running Sich for days, I want every child that PTYSession.terminate() kills to be reaped even when the kernel takes longer than 100 ms to tear it down, so that the process table does not fill with <defunct> children."
    acceptance_criteria:
      - id: AC-1
        text: "Fast path unchanged: a child that exits within the bounded WNOHANG loop in app/Sources/SichCore/PTYSession.swift terminate() is reaped synchronously and childPID is cleared (existing PTY tests stay green)."
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "Slow path: when the bounded loop expires, terminate() arms an asynchronous reaper for the pid (DispatchSource process-exit source or a detached utility-QoS waitpid(pid, 0)) instead of dropping it, and returns without blocking the caller (≤ ~150 ms measured in the test)."
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "Regression test in app/Tests/SichCoreTests spawns a real child through PTYSession whose teardown lags past the loop (e.g. SIGSTOP it first so SIGKILL delivery/teardown is delayed, or use a helper that delays exit) and asserts that, after the child dies, waitpid(pid, WNOHANG) returns -1/ECHILD — i.e. no zombie remains. Proven red→green (the test fails on the current 100 ms-then-forget code)."
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "Live check on the running app: after ≥ 2 probe cycles (≥ 10 min) `ps -Ao ppid,stat | awk '$1==<sich pid> && $2 ~ /Z/'` prints nothing."
        verify: manual
        manual_instructions: "Launch the rebuilt Sich, wait ≥ 10 min so the /usage probes ran at least twice, then run the ps one-liner with the app's pid. Expect empty output."
        status: pending
        specs: []
        tests: []
      - id: AC-5
        text: "Build, tests and quality checks pass on the changed files (cd app && swift build; swift test; swiftlint on changed .swift files)."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - "waitpid returns -1/ECHILD (already reaped elsewhere, e.g. pollExit) → no-op, no reaper"
      - "child dies inside the fast loop → no reaper armed (no stray dispatch sources)"
      - "app quits while reapers are pending → acceptable; launchd/init adopts orphans"
      - "terminate() called twice → second call is a no-op (childPID already -1)"
    depends_on: []
