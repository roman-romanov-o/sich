stories:
  - id: US-001
    title: "Board stays calm under hook traffic"
    view: us-001-flow
    priority: must
    kind: story
    status: ready
    story: "As an operator with many WORKING cards, I want a hook event to touch only the card it belongs to, so that the board does not stutter and re-animate every card on every observation."
    acceptance_criteria:
      - id: AC-1
        text: "The column diff key in app/Sources/SichApp/BoardView.swift excludes updatedAt (and any other observation timestamp): two BoardCards that differ only in updatedAt produce equal faces, so renderColumn short-circuits. (R9)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "When one card's state changes, the other cards in that column keep their existing view instances (same object identity after the refresh), and no new SessionCard is created for them. Proven red→green against the current rebuild-all path. (R9)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "persistTasks is debounced (≈250 ms) and performs the file write off the main actor; N mutations inside the window produce one write. The archive is stored in its own file so board writes do not rewrite archived tasks. (R10)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "reconcileCodexChoiceScreens runs at most 4× per second of wall clock regardless of pump rate, and pumpBackgroundSessions applies a per-tick global byte budget with round-robin so one noisy card cannot starve the others. (R11, R12)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-5
        text: "Build, tests and quality checks pass on the changed files (cd app && swift build; swift test; swiftlint)."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "column move", trigger: "a card changes state and therefore column", expected: "it is removed from the old column view and inserted in the new one in the correct order" }
      - { name: "chip-only change", trigger: "only the host chip status changes", expected: "only that card redraws" }
      - { name: "quit during debounce", trigger: "app terminates inside the debounce window", expected: "the pending write is flushed synchronously before exit" }
    depends_on: []
    decisions: []

  - id: US-002
    title: "Drill-in terminal repaints only what changed"
    view: us-002-flow
    priority: must
    kind: story
    status: ready
    story: "As an operator typing into a busy agent terminal, I want each frame to cost less than a display refresh, so that keystrokes and agent output never lag."
    acceptance_criteria:
      - id: AC-1
        text: "RenderState.snapshot reuses a preallocated cell buffer (no per-frame [TerminalCell] or per-row array allocation) and rowChanged compares per-row hashes, not cell arrays. (R4)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "draw(_:) draws only rows in an explicit dirty-row set (or the rects from getRectsBeingDrawn): a frame that changes row 3 and row 40 draws exactly those two rows, not the rows between. (R2)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "TerminalLinkDetector runs on a row only when that row's content changed since its links were last computed; a repaint of an unchanged row performs zero regex evaluations. (R1)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "glyphAttrs is keyed on the raw (fg, bg, style) tuple; ContrastColor.adjusted is evaluated at most once per distinct key for the lifetime of the cache. (R5)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-5
        text: "Text is drawn from a per-(scalar, style) glyph cache with CTFontDrawGlyphs at col × cellWidth; NSString.draw is no longer on the per-run path. (R3)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-6
        text: "Visual parity: a Claude session with colours, bold, links, wide glyphs and a selection looks the same as before the change; link underlines still appear on ⌘-hover."
        verify: manual
        manual_instructions: "Open a drill-in with a running claude, produce a colourful screen (e.g. /help), ⌘-hover a URL and a file path, select text, resize the window. Compare against the pre-change build side by side."
        status: pending
        specs: []
        tests: []
      - id: AC-7
        text: "Build, tests and quality checks pass on the changed files."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "resize / theme / font change", trigger: "any of these", expected: "full-viewport redraw, caches invalidated" }
      - { name: "scrollback view", trigger: "user scrolls up", expected: "dirty-row logic applies to the scrolled viewport, not the live one" }
      - { name: "combining marks", trigger: "a cell with a base scalar + combining marks", expected: "rendered identically to today (fallback to string drawing for that cell is acceptable)" }
    depends_on: []
    decisions: []

  - id: US-003
    title: "Remote cards never block the window"
    view: us-003-flow
    priority: must
    kind: story
    status: ready
    story: "As an operator with remote cards, I want every ssh probe to run off the main actor with a hard upper bound, so that a slow or dead host can never freeze Sich."
    acceptance_criteria:
      - id: AC-1
        text: "No @MainActor code path calls RemoteSessionProbe.presence or SSHCommandRunner synchronously: remoteSessionConflict and remoteSessionIsLost in BoardShell become async (or callback-based) and the window stays responsive while a probe is in flight. Proven with a runner stub that sleeps 3 s. (R14)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "SSHCommandRunner.bounded returns within deadline + 1 s under every outcome, including a child that ignores SIGTERM and a grandchild that keeps stdout open after SIGKILL; stdin write is bounded and pipes are closed on timeout. Proven red→green with a `sh -c 'sleep 30 & wait'`-style fixture. (R14)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "RemoteEventRelay reconnects with exponential backoff (5 s → capped at 60 s), reports the failure reason on the host chip, and is stopped when the last card for that host is removed. (R18)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "Build, tests and quality checks pass on the changed files."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "probe result after card removed", trigger: "async probe completes for a card that no longer exists", expected: "result dropped, no crash" }
      - { name: "host comes back", trigger: "relay was backing off and the host is reachable again", expected: "next attempt succeeds and backoff resets" }
    depends_on: []
    decisions: []

  - id: US-004
    title: "User config and task book are never silently damaged"
    view: us-004-flow
    priority: must
    kind: story
    status: ready
    story: "As a user, I want Sich to refuse to overwrite a settings.json it cannot parse and to tell me when the task book failed to save, so that my configuration and my board are never lost quietly."
    acceptance_criteria:
      - id: AC-1
        text: "HookInstaller leaves a non-empty but unparsable ~/.claude/settings.json untouched and returns/throws a descriptive error; the file's bytes are identical after installGlobal(). Proven red→green (today the file is replaced by a hooks-only document). (R15)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "A parsable settings.json is written atomically with the previous content kept as settings.json.bak; every key other than the hooks block round-trips unchanged. (R15)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "A failed BoardTaskStore save (e.g. unwritable directory) is logged with the underlying error and surfaced to the operator once per launch through the existing alert/banner mechanism; the app does not crash and subsequent saves retry. (R16)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "Build, tests and quality checks pass on the changed files."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "missing or empty settings.json", trigger: "file absent or zero bytes", expected: "created with the hooks block as today" }
      - { name: "settings.json with trailing junk", trigger: "valid JSON followed by garbage", expected: "treated as unparsable: left alone, reported" }
    depends_on: []
    decisions: []

  - id: US-005
    title: "Sessions release their fds and children"
    view: us-005-flow
    priority: should
    kind: enabler
    status: ready
    story: "As an operator running Sich for days, I want every closed session to release its pty fd and child, so that recycled fds never deliver another session's bytes and the process table stays clean."
    acceptance_criteria:
      - id: AC-1
        text: "PTYSession has a deinit that terminates the child (if alive) and closes the master fd; dropping the last reference to a live session leaves no open fd (checked via fcntl(F_GETFD) on the captured fd number). (R17)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "TerminalSurface closes the pty fd only inside the DispatchSourceRead cancel handler; the fd is never closed while the source is still armed. Proven with a test that cancels during an in-flight read and asserts no EBADF/foreign-fd read. (R17)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "Build, tests and quality checks pass on the changed files."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "terminate twice", trigger: "terminate() then deinit", expected: "second path is a no-op" }
      - { name: "zombie after slow teardown", trigger: "child outlives the 100 ms reap loop", expected: "handled by task-100's async reaper; out of scope here" }
    depends_on: []
    decisions: []

  - id: US-006
    title: "One reducer decides card state"
    view: us-006-flow
    priority: should
    kind: enabler
    status: ready
    story: "As a maintainer, I want card state computed by one pure function from its inputs, so that the side-maps in BoardShell cannot disagree and refresh() can no longer re-fire notifications."
    acceptance_criteria:
      - id: AC-1
        text: "A pure CardStateReducer in SichCore maps (detector state, manual-done flag, codex-choice flag, idle-hold, process liveness, remote link health) → CardState, and BoardShell derives cards[].state exclusively from it; manuallyDoneCardIDs, codexChoiceWaitingCardIDs, idleHoldUntil and lastCardStates are either inputs to the reducer or deleted. (R21)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-2
        text: "Every rule in docs/CARD-STATUS.md has a unit test against the reducer (including rule 2.3 background subagent keeps WORKING, Stop→waiting, SessionEnd→resumable idle, manual DONE beats detector). (R21)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-3
        text: "BoardShell.refresh() is split into render() (no side effects) and reconcile() (notifications, badge, work log); calling render() twice in a row produces no notification, badge or work-log change. (R22)"
        verify: automated
        status: pending
        specs: []
        tests: []
      - id: AC-4
        text: "CardStatusRealAgentE2ETests pass with SICH_REAL_AGENT_E2E=1 after the extraction."
        verify: manual
        manual_instructions: "cd app && SICH_REAL_AGENT_E2E=1 swift test --filter CardStatusRealAgentE2ETests; all green."
        status: pending
        specs: []
        tests: []
      - id: AC-5
        text: "Build, tests and quality checks pass on the changed files."
        verify: automated
        status: pending
        specs: []
        tests: []
    edge_cases:
      - { name: "conflicting inputs", trigger: "detector says WORKING while manual-done is set", expected: "manual DONE wins, deterministic" }
      - { name: "hydrated card", trigger: "restore from task book with no live process", expected: "reducer yields resumable idle, not WORKING" }
    depends_on: [US-001]
    decisions: []

