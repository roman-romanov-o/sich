document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, agent:'codex', pool:'codex', blocked:false,\n        peek:['✓ arrow keys move selection','✓ ⌘↵ opens drill-in','awaiting review'] },\n      { id:'b-export', flow:'B', column:'running', name:'Export cycle report CSV', branch:'feat/export-csv', agent:'gemini', pool:'gemini', blocked:false,\n        peek:['generating columns…','> per-pool burn · projects done','writing report.csv','running…'] },\n    ],\n  };\n\n  componentDidMount(){ this.ticks = 0; this._t = setInterval(()=>this.tick(), 2500); }\n  componentWillUnmount(){ clearInterval(this._t); clearTimeout(this._c); clearTimeout(this._j); }\n\n  tick(){\n    this.ticks = (this.ticks||0) + 1;\n    const phases = ['Plan','Build','Test','QA'];\n    this.setState(s => {\n      const tasks = s.tasks.map(t => ({...t}));\n      tasks.forEach(t => {\n        if(t.column==='running' && t.flow==='A'){\n          t._tc = (t._tc||0) + 1;\n          if(t._tc % 2 === 0){\n            const i = phases.indexOf(t.phase); const ni = (i+1) % phases.length; t.phase = phases[ni];\n            if(ni===0){ t.iter += 1; if(t.stories[0] < t.stories[1]) t.stories = [t.stories[0]+1, t.stories[1]]; }\n          }\n        }\n      });\n      const exp = tasks.find(t => t.id==='b-export');\n      if(exp){\n        if(this.ticks===6){ exp.column='waiting'; exp.blocked=false; exp.prompt='Overwrite existing report.csv?\\n(y/n)'; }\n        if(this.ticks===14){ exp.column='running'; }\n      }\n      const aRun = tasks.some(t=>t.flow==='A' && t.column==='running');\n      const bRun = tasks.some(t=>t.flow==='B' && t.column==='running');\n      return {\n        tasks,\n        interactive: Math.min(98, s.interactive + (bRun?0.5:0.15)),\n        apiCredit: Math.min(95, s.apiCredit + (aRun?0.4:0)),\n        codex: Math.min(97, s.codex + (tasks.some(t=>t.agent==='codex'&&t.column==='running')?0.25:0)),\n        gemini: Math.min(97, s.gemini + (tasks.some(t=>t.agent==='gemini'&&t.column==='running')?0.2:0)),\n        resetMins: s.resetMins > 3 ? s.r ump.interactive = Math.min(98, s.interactive+0.4);\n      else if(task.pool==='api') bump.apiCredit = Math.min(95, s.apiCredit+0.3);\n      else if(task.pool==='codex') bump.codex = Math.min(97, s.codex+0.3);\n      else if(task.pool==='gemini') bump.gemini = Math.min(97, s.gemini+0.3);\n      return { termLines: {...s.termLines, [id]: base}, termDraft:'', tasks, ...bump };\n    });\n  }\n\n  renderVals(){\n    const S=this.state, P=this.props;\n    const accent = P.accent ?? '#E8B259';\n    const dense = (P.density ?? 'Comfortable')==='Compact';\n    const pad = (dense?10:15)+'px';\n    const cardpad = (dense?8:11)+'px';\n    const recActive = P.recommenderActive ?? true;\n    const fmt = m => m>=60 ? (Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m') : (m+'m');\n    const r = Math.round;\n    const SIG='var(--sig)', ALERT='var(--alert)', HI='var(--hi)', MID='var(--mid)', LOW='var(--low)';\n\n    const AGENT = { claude:'Claude Code', codex:'Codex', gemini:'Gemini' };\n    const POOL = { interactive:'window', api:'SDK credit', codex:'Codex', gemini:'Gemini' };\n\n    // state -> minimal semantic color. Color is scarce: only attention + active get it.\n    const stateMeta = t => {\n      switch(t.column){\n        case 'backlog': return {label:'idle', color:LOW};\n        case 'ready': return {label: t.flow==='A'?'ready':'queued', color:MID};\n        case 'running': return {label:'running', color:HI, running:true, dot:true};\n        case 'waiting': return {label:'waiting on you', color:SIG, attn:true, dot:true};\n        case 'review': return {label:'review', color:MID};\n        case 'done': return {label:'done', color:LOW};\n        default: return {label:'', color:LOW};\n      }\n    };\n    const blockedMeta = {label:'blocked', color:ALERT, attn:true, dot:true};\n\n    const COLS = [\n      {key:'backlog', label:'backlog'},\n      {key:'ready', label:'ready'},\n      {key:'running', label:'running'},\n      {key:'waiting', label:'waiting · blocked', attn:true},\n      {key:'review', label:'review'},\n      {key:'done', label:'done'},\n    ];\n    const tasks = S.tasks;\n    const columns = COLS.map(c => ({\n      label:c.label, count: tasks.filter(t=>t.column===c.key).length,\n      rule: c.attn ? SIG : 'var(--line2)',\n      labelColor: c.attn ? SIG : MID,\n    }));\n\n    const toCard = t => {\n      const sm = t.blocked && t.column==='waiting' ? blockedMeta : stateMeta(t);\n      const isA = t.flow==='A';\n      let meta;\n      if(isA){\n        if(t.column==='backlog') meta = t.needsInteractive ? 'needs-interactive' : 'not started';\n        else meta = 'it'+t.iter+' · '+t.phase+' · '+t.stories[0]+'/'+t.stories[1];\n      } else meta = AGENT[t.agent];\n      const selected = S.selectedId===t.id;\n      const attn = sm.attn;\n      return {\n        id:t.id, name:t.name, branch:t.branch,\n        flowTag: t.flow,\n        chipColor: isA ? HI : MID,\n        chipBg: isA ? 'rgba(255,255,255,.09)' : 'transparent',\n        chipBorder: isA ? 'transparent' : 'var(--line2)',\n        stateColor: sm.color,\n        showDot: !!sm.dot,\n        dotAnim: sm.running ? 'animation:pulse 1.5s ease-in-out infinite;' : '',\n        meta, metaColor: (isA && t.needsInteractive) ? SIG : LOW,\n        poolShort: POOL[t.pool],\n        needsYou: t.column==='waiting',\n        needLabel: t.blocked ? '⊘ blocked — needs a decision' : '◷ waiting on you',\n        needLine: t.blocked ? 'rgba(229,84,75,.25)' : 'rgba(232,178,89,.25)',\n        bg: selected ? 'var(--elev)' : (attn ? (t.blocked?'rgba(229,84,75,.05)':'rgba(232,178,89,.05)') : 'var(--elev)'),\n        border: selected ? 'var(--mid)' : (attn ? (t.blocked?'rgba(229,84,75,.3)':'rgba(232,178,89,.3)') : 'var(--line)'),\n        shadow: selected ? '0 8px 22px rgba(0,0,0,.5)' : 'none',\n        onClick: ()=>this.select(t.id),\n        onDragStart: (e)=>this.dragStart(t.id,e),\n        onDragEnd: ()=>this.dragEnd(),\n      };\n    };\n\n    const dragging = !!S.dragId;\n    const LANES = [\n      {flow:'A', tag:'A', label:'saha', sub:'autonomous · SDK'},\n      {flow:'B', tag:'B', label:'interactive', sub:'Ghostty · window'},\n    ];\n    const swimlanes = LANES.filter(l => S.filter==='all' || S.filter===l.flow).map(l => ({\n      tag:l.tag, label:l.label, sub:l.sub,\n      cells: COLS.map(c => ({\n        onDrop: ()=>this.drop(c.key),\n        borderStyle: dragging ? 'dashed' : 'solid',\n        borderColor: dragging ? 'var(--line2)' : 'transparent',\n        bg: dragging ? 'rgba(255,255,255,.022)' : 'transparent',\n        tasks: tasks.filter(t => t.flow===l.flow && t.column===c.key).map(toCard),\n      })),\n    }));\n\n    // gauges: monochrome, colored only by pressure (amber tight, red critical)\n    const gFill = s => s>=90 ? ALERT : s>=72 ? SIG : 'rgba(255,255,255,.5)';\n    const gNum = s => s>=90 ? ALERT : s>=72 ? SIG : HI;\n    const gauges = [\n      {label:'Interactive', spent:S.interactive, sub:'resets '+fmt(S.resetMins)+' · wk '+S.weeklyPct+'%'},\n      {label:'SDK credit', spent:S.apiCredit, sub:(100-r(S.apiCredit))+'% free · sep. pool'},\n      {label:'Codex', spent:S.codex, sub:(100-r(S.codex))+'% free'},\n      {label:'Gemini', spent:S.gemini, sub:(100-r(S.gemini))+'% free'},\n    ].map(g => ({...g, spentLabel: r(g.spent)+'%', fill: gFill(g.spent), numColor: gNum(g.spent)}));\n\n    const projectsLeft = Math.max(1, r((100-S.apiCredit)/18));\n    const rec = recActive ? {\n      active:true, modeLabel:'· active',\n      title:'Start task-07 — Backlog→capacity matchmaker',\n      command:'saha run task-07',\n      why:'autonomous-ready · spends Agent SDK credit ('+(100-r(S.apiCredit))+'% free) — not your interactive window',\n      hold:'task-09 · needs the interactive window, only '+fmt(S.resetMins)+' left ('+r(S.interactive)+'% spent)',\n      projectsLeft,\n    } : {\n      active:false, modeLabel:'· passive',\n      title:'You have headroom this cycle',\n      why:'Agent SDK credit '+(100-r(S.apiCredit))+'% free · Codex '+(100-r(S.codex))+'% free · ~'+projectsLeft+' projects fit',\n      hold:'interactive window tight ('+r(S.interactive)+'% spent, resets '+fmt(S.resetMins)+')',\n      projectsLeft,\n    };\n\n    const waiting = tasks.filter(t => t.column==='waiting');\n    const hasBlocked = waiting.some(t => t.blocked);\n    const att = hasBlocked ? {color:ALERT, border:'rgba(229,84,75,.4)'} : {color:SIG, border:'rgba(232,178,89,.4)'};\n\n    let detail = null;\n    const sel = tasks.find(t => t.id===S.selectedId);\n    if(sel){\n      const sm = sel.blocked && sel.column==='waiting' ? blockedMeta : stateMeta(sel);\n      const poolNote = {\n        interactive:'Spends your interactive window ('+r(S.interactive)+'% spent, resets in '+fmt(S.resetMins)+').',\n        api:'Spends Agent SDK credit ('+(100-r(S.apiCredit))+'% free) — a separate pool from your interactive window.',\n        codex:'Spends Codex quota ('+(100-r(S.codex))+'% free).',\n        gemini:'Spends Gemini quota ('+(100-r(S.gemini))+'% free).',\n      }[sel.pool];\n      const pipeline = (sel.flow==='A' && sel.pipeline) ? sel.pipeline.map((st,i) => {\n        const color = st.status==='done'?'rgba(255,255,255,.55)': st.status==='active'?SIG: st.status==='blocked'?ALERT:LOW;\n        return {\n          name:st.name, color,\n          fill: st.status==='done'? 'rgba(255,255,255,.55)' : 'transparent',\n          anim: st.status==='active'||st.status==='blocked' ? 'animation:pulse 1.5s ease-in-out infinite;' : '',\n          nameColor: st.status==='pending'?MID:HI,\n          lineColor: st.status==='done'?'rgba(255,255,255,.3)':'var(--line2)',\n          lineHide: i===sel.pipeline.length-1 ? 'display:none;' : '',\n          statusText: st.status==='done'?'complete': st.status==='active'?'in progress': st.status==='blocked'?'blocked on you':'pending',\n        };\n      }) : null;\n      detail = {\n        id:sel.id, name:sel.name, branch:sel.branch,\n        flowLabel: sel.flow==='A'?'FLOW A · saha':'FLOW B · interactive',\n        flowColor: MID,\n        stateLabel: sm.label, stateColor: sm.color,\n        agentName: AGENT[sel.agent],\n        isA: sel.flow==='A', pipeline,\n        poolShort: POOL[sel.pool], poolRule: SIG, poolNote,\n        waitingPrompt: (sel.column==='waiting' && sel.prompt) ? sel.prompt : null,\n        waitTitle: sel.blocked ? '⊘ blocked — needs a decision' : '◷ waiting on you',\n        waitBorder: sel.blocked ? 'rgba(229,84,75,.3)' : 'rgba(232,178,89,.3)',\n        peek: sel.peek || [],\n        term: S.termLines[sel.id] || sel.peek || [],\n        ptyLabel: '/dev/ttys0'+(10 + tasks.findIndex(t=>t.id===sel.id)),\n        liveColor: (sel.column==='running'||sel.column==='waiting') ? 'var(--sig)' : 'var(--low)',\n        liveLabel: (sel.column==='running'||sel.column==='waiting') ? 'live' : 'idle',\n        promptHint: sel.column==='waiting' ? 'the agent is waiting — type your answer below' : null,\n        firewall: 'Helm hosts the session you launched — it bills your '+POOL[sel.pool]+'. It never runs a command or `claude -p` on your behalf.',\n      };\n    }\n\n    const seg = on => on ? {line:'var(--hi)', color:'var(--hi)'} : {line:'transparent', color:'var(--low)'};\n\n    return {\n      pad, cardpad, accent,\n      segAll: seg(S.filter==='all'), segA: seg(S.filter==='A'), segB: seg(S.filter==='B'),\n      setAll: ()=>this.setFilter('all'), setA: ()=>this.setFilter('A'), setB: ()=>this.setFilter('B'),\n      attentionCount: waiting.length, att, onAttention: ()=> waiting[0] && this.select(waiting[0].id),\n      columns, swimlanes, gauges, rec,\n      copyLabel: S.copied ? 'copied ✓' : 'copy',\n      onCopy: ()=>this.copy(),\n      allowDrop: (e)=>e.preventDefault(),\n      detail, onCloseDrawer: ()=>this.close(),\n      peekOpen: S.peekOpen, peekLabel: S.peekOpen ? 'hide read-only peek' : 'show read-only peek',\n      onTogglePeek: ()=>this.setState(s=>({peekOpen:!s.peekOpen})),\n      onJump: sel ? ()=>this.jump(sel.branch) : null,\n      termDraft: S.termDraft,\n      onTermInput: (e)=>this.termSet(e.target.value),\n      onTermKey: sel ? (e)=>this.termKey(sel.id, e) : null,\n      toast: S.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
