    fix_info: |
      DEFECT (found during human visual sign-off of US-001 AC1; render itself PASSED):
      An interactive shell logged out with Ctrl-D (EOF) is surfaced in the window title as
      "[crashed]" and the window appears stuck. Root cause CONFIRMED empirically via a PTY
      repro: a shell exits via EOF carrying the exit status of its LAST command. The operator
      pressed Ctrl-C while testing interrupt ($?=130), then Ctrl-D made zsh EXIT CLEANLY
      (WIFEXITED=true, no signal) with code 130. The lifecycle maps every non-zero exit to
      .crashed, and AppShell.label(for:) renders any .crashed as the word "crashed".

      Empirical exit codes (zsh -i driven through a PTY):
        plain Ctrl-D         -> WIFEXITED code 0   (today: "exited"  OK)
        `true`  then Ctrl-D  -> WIFEXITED code 0   (today: "exited"  OK)
        Ctrl-C then Ctrl-D   -> WIFEXITED code 130 (today: "crashed" WRONG  <- operator's case)
        `false` then Ctrl-D  -> WIFEXITED code 1   (today: "crashed" WRONG)

      WHY IT'S WRONG (grounded in the FROZEN spec — these must NOT be weakened):
        - US-001 Edge Case 2: a session that "terminates unexpectedly" must have the surface
          "show the exit CLEANLY". A deliberate Ctrl-D logout is the cleanest possible end;
          labeling it "crashed" is the opposite of "cleanly".
        - TC-E2E-104 defines a "crash" as an ABRUPT kill (a terminating SIGNAL), NOT a
          non-zero EXIT. "crashed" must be reserved for WIFSIGNALED, not a WIFEXITED code.

      REQUIRED FIX (presentation layer — keeps the frozen registry contract intact):
        1. Distinguish, for the user-facing surface, a SIGNAL death from a NON-SIGNAL exit
           using the ProcessExit payload already carried by .crashed(ProcessExit):
             .exited                                   -> "exited"
             .crashed(exit) where exit.signal != nil   -> "crashed" / "killed (signal N)"  (TC-E2E-104)
             .crashed(exit) where exit.code   != nil   -> "exited (code N)" / "session ended (N)"  (NOT "crashed")
           A clean WIFEXITED with ANY code is an EXIT, never a "crash".
        2. Show the end CLEANLY instead of freezing on the last frame: when the session
           terminates, render a clear unobtrusive "session ended (exit N)" affordance in the
           surface (dim banner / appended line) so the window does not read as hung.
        3. Make the disposition a WINDOW-FREE, TESTABLE seam (like KeyEncoder/keyInput): a
           pure function SessionState -> presentation string, unit-tested without AppKit.
           This same pure function is what the Phase 03 board card will consume later.

      HARD CONSTRAINTS (integrity — must stay green, do not delete/weaken):
        - SessionRegistryTests frozen cases stay as-is and green: clean exit(0)->.exited;
          `exit 3`->.crashed(code 3); SIGKILL->.crashed(signal); firewall refuses `claude -p`.
          Do NOT change the registry's exit-code classification or those tests.
        - swift test count must stay >= baseline (currently 23); ADD tests, never remove.
        - Do NOT touch user-stories/ or test-specs/ (frozen).

      REGRESSION TEST (close the gap the headless suite missed):
        Add a DETERMINISTIC, window-free test that drives a real interactive shell through
        the PTY, sends Ctrl-C (0x03) then Ctrl-D (0x04), reconciles to a terminal state, and
        asserts the USER-FACING disposition is a clean EXIT (not "crashed") despite the
        non-zero code. Plus a unit test over the pure disposition function covering all three
        buckets: .exited, .crashed(signal)->crashed, .crashed(code)->exited-with-code.
        Drive the shell as SessionRegistryTests.launch + reconcile already does; for the
        keystrokes write 0x03 then 0x04 to the PTY master via session.send.

      OUT OF SCOPE: do NOT start Phase 02 live wiring. This iteration only repairs the
      Phase 01 terminal-surface lifecycle presentation so the foundation is solid.
    files_changed: []
    files_added: []
