  - iteration: 4
    started_at: 2026-06-20T23:55:00Z
    trigger: human_signoff_rejection
    steps:
      - phase: review
        status: completed
        output_summary: >-
          code-reviewer subagent named the anti-pattern: "stub substitution at the integration
          boundary" — an interaction AC bound to a direct handler call (goBack(),
          BoardSelection.returnToBoard()) instead of the stimulus the USER supplies (a dispatched
          event). All three false passes share it: every "Esc/return" test called a method, none
          dispatched a key event past the terminal (the real first responder eating Esc). Prescribed
          gate rule: an interaction AC must be covered by a test whose stimulus is the same KIND the
          user provides (a dispatched NSEvent / keyDown / sendEvent / performKeyEquivalent or a
          declared event seam), proven red→green; a method call does NOT satisfy an input AC.
          (Refined the reviewer's AppKit mechanism story with provable-from-code facts: intercept in
          keyDown where keyCode 53 already lands, NOT cancelOperation which keyDown pre-empts.)
      - phase: implementation
        status: completed
        output_summary: >-
          Real-input fix, proven red→green. (1) Added an injectable escape seam
          TerminalSurface.onEscape: (() -> Bool)? and an intercept in keyDown: where .escape is
          mapped (keyCode 53), offer it to onEscape FIRST — true ⇒ consume (leave surface), nil/false
          ⇒ forward to the PTY so a future real agent can still receive Esc. (2) DrillInPanel.focus
          sets surface.onEscape = { goBack(); true } and removed the shadowed button.keyEquivalent
          = Esc (rewrote the doc-comment to say Esc now lives in TerminalSurface.onEscape). (3) Wrote
          the test the prior 3 iterations lacked: escReturnsToBoardViaEventDispatch constructs a real
          Esc NSEvent (keyCode 53) and dispatches it to window.firstResponder — RED first (precondition
          PASSED = terminal focused, returns FAILED = Esc went to PTY), GREEN after the seam. (4) That
          faithful test then exposed a SECOND latent gap: buildContentForTesting() never called
          wireInteractions(), so drillIn.onClose was nil and goBack() fired into the void — fixed by
          wiring the test harness exactly as applicationDidFinishLaunching does.
      - phase: integrity_guard
        status: passed
        output_summary: >-
          All 13 frozen-spec files still hash-match spec_baseline. Implementer touched only app/
          (TerminalSurface, DrillInPanel, BoardShell + DrillInInteractionTests). Contract intact.
