# Toolchain profile for the saha execution loop (read by /saha:execute Step 0).
# This repo is a Swift/AppKit app (app/) with a small residue of repo-level
# Python tests; the Python sidecar itself was retired in task-03.
#
# Known flake: GridTextTests.fromPTY can go red under full-suite concurrency
# (macOS PTY-EOF race). Re-run that single test before treating it as a defect.

build:
  command: "cd app && swift build"
test:
  command: "uv run pytest -q tests && cd app && swift test"
  file_globs: ["app/Tests/**/*.swift", "tests/**/*.py"]
quality:
  commands: ["cd app && swiftlint lint --quiet", "ruff check"]
  changed_files_only: true
run:
  command: "cd app && swift run ghostling"
